<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=1200">
    <meta name="referrer" content="no-referrer">
    <title>MdOut! — MyBiOut!</title>
    <link rel="icon" href="/assets/logo.png" type="image/png">
    <link rel="stylesheet" href="/assets/entry.css">
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        a {
            text-decoration: none;
            color: inherit;
        }

        ::-webkit-scrollbar {
            width: 6px;
        }

        ::-webkit-scrollbar-track {
            background: transparent;
        }

        ::-webkit-scrollbar-thumb {
            background: #E85B8A;
            border-radius: 3px;
        }

        body {
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            background: url('/assets/bg.png') center center / cover no-repeat fixed;
            font-family: "Microsoft YaHei", "Segoe UI", system-ui, sans-serif;
            cursor: default;
            -webkit-font-smoothing: antialiased;
        }

        #bg-cv {
            position: fixed;
            inset: 0;
            z-index: 0;
            pointer-events: none;
        }

        .page {
            position: relative;
            z-index: 1;
            width: 1200px;
            height: 100vh;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            padding: 18px 20px 14px;
        }

        /* Header */
        .hdr {
            display: flex;
            align-items: center;
            gap: 22px;
            margin-bottom: 14px;
            flex-shrink: 0;
            background: #FB7299;
            padding: 10px 16px;
            border: 3px solid #e45a84;
            box-shadow: 4px 4px 0 #F5A623;
        }

        .back {
            background: #fff;
            color: #FB7299;
            font-size: 13px;
            font-weight: 700;
            padding: 8px 18px;
            border: 3px solid #e45a84;
            box-shadow: 4px 4px 0 #F5A623;
            transition: transform .12s, box-shadow .12s;
            cursor: pointer;
        }

        .back:hover {
            transform: translate(2px, 2px);
            box-shadow: 2px 2px 0 #F5A623;
        }

        .hdr h1 {
            font-size: 32px;
            font-weight: 900;
            color: #fff;
            text-shadow: 2px 2px 0 #e45a84;
            transform: rotate(-0.6deg);
        }

        .hdr-stats {
            margin-left: auto;
            font-size: 13px;
            font-weight: 700;
            color: #fff;
            display: flex;
            gap: 16px;
        }

        .hdr-stats span {
            color: #263238;
            background: #fff;
            padding: 1px 5px;
        }

        /* ===== MAIN AREA (shared) ===== */
        .main-area {
            flex: 1;
            min-height: 0;
        }

        /* ===== CARD GRID ===== */
        .card-grid {
            display: grid;
            grid-template-columns: 5fr 3fr 2.5fr;
            grid-template-rows: 1fr 1fr;
            gap: 16px;
            height: 100%;
        }

        .func-card {
            background: rgba(255, 255, 255, .92);
            backdrop-filter: blur(10px);
            border: 3px solid #F5A623;
            box-shadow: 5px 5px 0 #E85B8A;
            padding: 24px 28px;
            position: relative;
            overflow: hidden;
            cursor: pointer;
            transition: transform .18s, box-shadow .18s, border-color .18s;
            display: flex;
            flex-direction: column;
        }

        .func-card:hover {
            transform: translate(3px, 3px) rotate(0deg) !important;
            box-shadow: 2px 2px 0 #E85B8A;
            border-color: #E85B8A;
        }

        .func-card.card-video {
            grid-column: 1;
            grid-row: 1 / 3;
            transform: rotate(-0.4deg);
        }

        .func-card.card-user {
            grid-column: 2 / 4;
            grid-row: 1;
            transform: rotate(0.3deg);
        }

        .func-card.card-article {
            grid-column: 2;
            grid-row: 2;
            transform: rotate(-0.25deg);
        }

        .func-card.card-done {
            grid-column: 3;
            grid-row: 2;
            transform: rotate(0.35deg);
            cursor: default;
        }

        .func-card.card-done:hover {
            transform: translate(0, 0) rotate(0deg) !important;
            box-shadow: 5px 5px 0 #E85B8A;
        }

        .func-emoji {
            font-size: 48px;
            margin-bottom: 12px;
            line-height: 1;
        }

        .card-video .func-emoji {
            font-size: 72px;
            margin-bottom: 18px;
        }

        .func-name {
            font-size: 22px;
            font-weight: 900;
            color: #333;
            margin-bottom: 8px;
        }

        .card-video .func-name {
            font-size: 28px;
            margin-bottom: 12px;
        }

        .func-desc {
            font-size: 14px;
            color: #666;
            line-height: 1.7;
            margin-bottom: 10px;
            flex: 1;
        }

        .card-video .func-desc {
            font-size: 15px;
        }

        .func-accept {
            font-size: 12px;
            font-weight: 700;
            color: #E85B8A;
            background: rgba(232, 91, 138, .08);
            padding: 6px 12px;
            border: 1px dashed #E85B8A;
            display: inline-block;
        }

        .card-video .func-accept {
            font-size: 13px;
            padding: 8px 14px;
        }

        .func-count {
            position: absolute;
            top: 12px;
            right: 14px;
            background: #F5A623;
            color: #fff;
            font-size: 11px;
            font-weight: 700;
            padding: 2px 10px;
            border: 2px solid #d48b0e;
            min-width: 28px;
            text-align: center;
        }

        .func-count.has {
            background: #E85B8A;
            border-color: #c44876;
        }

        /* Done card */
        .done-title-row {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 8px;
        }

        .done-title-row .func-emoji {
            font-size: 28px;
            margin-bottom: 0;
        }

        .done-title-row .func-name {
            font-size: 17px;
            margin-bottom: 0;
        }

        .done-scroll {
            flex: 1;
            overflow-y: auto;
            margin: 4px 0;
        }

        .done-item {
            font-size: 12px;
            color: #666;
            padding: 3px 0;
            border-bottom: 1px solid #f0f0f0;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            cursor: pointer;
            transition: background .15s, color .15s;
        }

        .done-item:hover {
            background: rgba(245, 166, 35, .08);
            color: #E85B8A;
        }

        .done-item b {
            color: #27ae60;
        }

        .done-empty {
            color: #ccc;
            font-size: 13px;
            text-align: center;
            padding: 16px 0;
        }

        .done-ft {
            margin-top: auto;
            padding-top: 6px;
        }

        /* ===== PANEL VIEW ===== */
        .panel-wrap {
            display: flex;
            flex-direction: column;
            height: 100%;
            gap: 12px;
        }

        .panel-top {
            display: flex;
            align-items: center;
            gap: 14px;
            flex-shrink: 0;
            background: rgba(255, 255, 255, .92);
            backdrop-filter: blur(10px);
            border: 3px solid #F5A623;
            box-shadow: 5px 5px 0 #E85B8A;
            padding: 12px 20px;
        }

        .panel-icon {
            font-size: 28px;
        }

        .panel-title {
            font-size: 22px;
            font-weight: 900;
            color: #E85B8A;
        }

        .panel-type-hint {
            margin-left: auto;
            font-size: 12px;
            font-weight: 700;
            color: #888;
        }

        .panel-input {
            display: flex;
            align-items: flex-start;
            gap: 10px;
            flex-shrink: 0;
            background: rgba(255, 255, 255, .92);
            backdrop-filter: blur(10px);
            border: 3px solid #F5A623;
            box-shadow: 4px 4px 0 #E85B8A;
            padding: 10px 16px;
        }

        .panel-input input,
        .panel-input textarea {
            flex: 1;
            padding: 8px 12px;
            border: 2px solid #F5A623;
            font-size: 14px;
            font-family: inherit;
            outline: none;
            background: #fff;
            transition: border-color .2s;
        }

        .panel-input input:focus,
        .panel-input textarea:focus {
            border-color: #E85B8A;
        }

        .input-stack {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 4px;
            min-width: 0;
        }

        .panel-input textarea {
            min-height: 88px;
            max-height: 160px;
            resize: vertical;
            line-height: 1.45;
        }

        .input-count {
            font-size: 11px;
            font-weight: 700;
            color: #E85B8A;
            min-height: 14px;
        }

        .btn-plus {
            min-width: 40px;
            min-height: 40px;
            align-self: flex-start;
            font-size: 20px;
            line-height: 1;
            padding: 6px 10px;
        }

        .panel-input > .btn-or {
            align-self: flex-start;
            min-height: 40px;
        }

        .panel-body {
            flex: 1;
            display: grid;
            grid-template-columns: 1fr 1.5fr;
            gap: 12px;
            min-height: 0;
        }

        .panel-col {
            background: rgba(255, 255, 255, .92);
            backdrop-filter: blur(10px);
            border: 3px solid #F5A623;
            box-shadow: 4px 4px 0 #E85B8A;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .panel-col-hd {
            padding: 10px 14px 6px;
            border-bottom: 3px dashed #F5A623;
            display: flex;
            align-items: center;
            gap: 10px;
            flex-shrink: 0;
        }

        .panel-col-hd h3 {
            font-size: 15px;
            font-weight: 900;
            color: #E85B8A;
            white-space: nowrap;
        }

        .badge {
            background: #F5A623;
            color: #fff;
            font-size: 11px;
            font-weight: 700;
            padding: 2px 8px;
            border: 2px solid #d48b0e;
            min-width: 24px;
            text-align: center;
        }

        .panel-col-hd-right {
            margin-left: auto;
            display: flex;
            gap: 6px;
            align-items: center;
        }

        .panel-list {
            flex: 1;
            overflow-y: auto;
            padding: 6px 10px;
        }

        .panel-col-ft {
            padding: 6px 10px;
            border-top: 2px solid rgba(245, 166, 35, .2);
            display: flex;
            gap: 5px;
            flex-wrap: wrap;
            flex-shrink: 0;
            align-items: center;
        }

        /* Item cards */
        .item {
            background: #fff;
            border: 2px solid #eee;
            padding: 8px 10px;
            margin-bottom: 6px;
            cursor: pointer;
            position: relative;
            transition: border-color .18s, box-shadow .18s, transform .18s, background .18s;
            border-left: 4px solid #ccc;
        }

        .item:hover {
            transform: translateX(3px);
            box-shadow: 0 2px 8px rgba(232, 91, 138, .12);
            border-color: #F5A623;
        }

        .item.sel {
            background: rgba(245, 166, 35, .06);
            border-color: #E85B8A;
            border-left-color: #E85B8A !important;
        }

        .item.sel::after {
            content: "";
            position: absolute;
            top: 0;
            right: 0;
            border: 8px solid transparent;
            border-top-color: #E85B8A;
            border-right-color: #E85B8A;
        }

        .item-video {
            border-left-color: #8e44ad;
        }

        .item-user {
            border-left-color: #27ae60;
        }

        .item-article {
            border-left-color: #2980b9;
        }

        .item-title {
            font-size: 13px;
            font-weight: 700;
            color: #333;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            margin-bottom: 2px;
        }

        .item-sub {
            font-size: 11px;
            color: #888;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .item-status {
            font-size: 10px;
            font-weight: 700;
            margin-top: 3px;
            padding: 1px 6px;
            display: inline-block;
        }

        .item-status.pending {
            background: #f0f0f0;
            color: #888;
        }

        .item-status.fetching {
            background: linear-gradient(90deg, #E85B8A, #F5A623, #E85B8A);
            background-size: 200% auto;
            color: #fff;
            animation: shimmer 1.5s linear infinite;
        }

        .item-status.ready {
            background: #27ae60;
            color: #fff;
        }

        .item-status.failed {
            background: #e74c3c;
            color: #fff;
        }

        @keyframes shimmer {
            0% {
                background-position: 0% center
            }

            100% {
                background-position: 200% center
            }
        }

        /* 预览 */
        .preview-area {
            flex: 1;
            overflow-y: auto;
            padding: 10px 14px;
        }

        .md-rendered h1 {
            font-size: 20px;
            color: #333;
            border-bottom: 2px solid #F5A623;
            padding-bottom: 5px;
            margin-bottom: 8px;
        }

        .md-rendered h2 {
            font-size: 16px;
            color: #E85B8A;
            margin-top: 14px;
            margin-bottom: 6px;
        }

        .md-rendered h3 {
            font-size: 14px;
            color: #F5A623;
            margin-top: 10px;
            margin-bottom: 4px;
        }

        .md-rendered table {
            border-collapse: collapse;
            width: 100%;
            margin: 6px 0;
            font-size: 12px;
        }

        .md-rendered th,
        .md-rendered td {
            border: 1px solid #ddd;
            padding: 4px 8px;
            text-align: left;
        }

        .md-rendered th {
            background: #F5A623;
            color: #fff;
            font-size: 11px;
        }

        .md-rendered blockquote {
            border-left: 3px solid #E85B8A;
            padding-left: 10px;
            color: #888;
            margin: 6px 0;
            font-size: 12px;
        }

        .md-rendered code {
            background: #f5f5f5;
            padding: 1px 4px;
            font-size: 11px;
        }

        .md-rendered p {
            margin: 5px 0;
            font-size: 13px;
            line-height: 1.6;
            color: #444;
        }

        .md-rendered hr {
            border: none;
            border-top: 2px dashed #F5A623;
            margin: 10px 0;
        }

        .md-rendered img {
            max-width: 100%;
            max-height: 180px;
            border: 2px solid #F5A623;
        }

        .md-rendered em {
            color: #888;
        }

        .md-rendered ul,
        .md-rendered ol {
            padding-left: 18px;
            font-size: 13px;
        }

        .md-raw {
            white-space: pre-wrap;
            word-break: break-all;
            font-size: 11px;
            font-family: "Cascadia Code", "Consolas", "Courier New", monospace;
            color: #333;
            line-height: 1.5;
            padding: 0;
        }

        /* Buttons */
        .btn {
            padding: 5px 12px;
            font-size: 12px;
            font-weight: 700;
            border: 2px solid;
            cursor: pointer;
            font-family: inherit;
            white-space: nowrap;
            transition: transform .1s, box-shadow .1s, opacity .2s;
        }

        .btn:active {
            transform: translate(1px, 1px) !important;
        }

        .btn:disabled {
            opacity: .4;
            cursor: not-allowed;
        }

        .btn-pk {
            background: #E85B8A;
            color: #fff;
            border-color: #c44876;
            box-shadow: 3px 3px 0 #F5A623;
        }

        .btn-or {
            background: #F5A623;
            color: #fff;
            border-color: #d48b0e;
            box-shadow: 3px 3px 0 #E85B8A;
        }

        .btn-gh {
            background: transparent;
            color: #E85B8A;
            border-color: #E85B8A;
            box-shadow: 2px 2px 0 #F5A623;
        }

        .btn-gn {
            background: #27ae60;
            color: #fff;
            border-color: #1e8449;
            box-shadow: 3px 3px 0 #F5A623;
        }

        .btn-xs {
            padding: 2px 8px;
            font-size: 10px;
        }

        /* Log Bar */
        .logbar {
            flex-shrink: 0;
            height: 100px;
            margin-top: 12px;
            background: rgba(30, 30, 40, .88);
            backdrop-filter: blur(8px);
            border: 3px solid #F5A623;
            box-shadow: 5px 5px 0 #E85B8A;
            padding: 10px 16px;
            overflow: hidden;
        }

        .log-msgs {
            height: 100%;
            overflow-y: auto;
            font-size: 12px;
            line-height: 1.7;
            font-family: "Cascadia Code", "Consolas", "Courier New", monospace;
        }

        .log-msgs::-webkit-scrollbar-thumb {
            background: #F5A623;
        }

        .lm {
            opacity: 0;
            animation: logIn .3s ease-out forwards;
        }

        @keyframes logIn {
            from {
                opacity: 0;
                transform: translateX(-12px)
            }

            to {
                opacity: 1;
                transform: translateX(0)
            }
        }

        .lm-time {
            color: #666;
        }

        .lm-info {
            color: #F5A623;
        }

        .lm-success {
            color: #2ecc71;
        }

        .lm-warn {
            color: #f39c12;
        }

        .lm-error {
            color: #e74c3c;
        }

        /* Toast */
        .toast {
            position: fixed;
            bottom: 32px;
            right: 32px;
            padding: 10px 22px;
            background: #F5A623;
            color: #fff;
            font-weight: 700;
            font-size: 13px;
            border: 3px solid #d48b0e;
            box-shadow: 4px 4px 0 #E85B8A;
            z-index: 9000;
            opacity: 0;
            transform: translateY(12px);
            transition: opacity .25s, transform .25s;
            pointer-events: none;
        }

        .toast.show {
            opacity: 1;
            transform: translateY(0);
        }

        .toast.err {
            background: #E85B8A;
            border-color: #c44876;
            box-shadow: 4px 4px 0 #F5A623;
        }

        /* Empty hint */
        .empty-hint {
            text-align: center;
            padding: 30px 10px;
            color: #ccc;
            font-size: 13px;
            font-weight: 700;
        }

        .empty-hint .em-icon {
            font-size: 32px;
            display: block;
            margin-bottom: 6px;
        }

        /* Card hover glow */
        .func-card::before {
            content: "";
            position: absolute;
            inset: 0;
            background: linear-gradient(135deg, rgba(245, 166, 35, .06), rgba(232, 91, 138, .06));
            opacity: 0;
            transition: opacity .3s;
            pointer-events: none;
        }

        .func-card:hover::before {
            opacity: 1;
        }

        /* card-done no hover glow */
        .func-card.card-done::before {
            display: none;
        }

    </style>
</head>

<body>

    <div class="mybiout-entry-overlay" aria-hidden="true">
        <canvas class="mybiout-entry-canvas"></canvas>
        <div class="mybiout-entry-stage">
            <div class="mybiout-entry-core"></div>
        </div>
    </div>
    <canvas id="bg-cv"></canvas>
    <div class="page">
        <!-- HEADER -->
        <div class="hdr">
            <a class="back" href="/" id="hdr-back">← 首页</a>
            <h1>MdOut!</h1>
            <div class="hdr-stats">
                <div>获取 <span id="st-fetch">0</span></div>
                <div>完成 <span id="st-done">0</span></div>
            </div>
        </div>

        <!-- ===== CARD GRID VIEW ===== -->
        <div class="main-area card-grid" id="view-grid">
            <!-- Video (largest) -->
            <div class="func-card card-video" onclick="打开面板('video')">
                <div class="func-count" id="cnt-video">0</div>
                <div class="func-emoji">🎬</div>
                <div class="func-name">视频信息导出</div>
                <div class="func-desc">
                    导出视频的完整信息为 Markdown 文档<br>
                    包含 UP 主、数据统计、标签、分P列表等
                </div>
                <div class="func-accept">BV号 · av号 · 视频链接 · b23短链</div>
            </div>

            <!-- User (medium) -->
            <div class="func-card card-user" onclick="打开面板('user')">
                <div class="func-count" id="cnt-user">0</div>
                <div class="func-emoji">👤</div>
                <div class="func-name">用户信息导出</div>
                <div class="func-desc">导出用户空间信息，包含数据统计与收藏夹内容</div>
                <div class="func-accept">UID · 空间链接</div>
            </div>

            <!-- Article (small) -->
            <div class="func-card card-article" onclick="打开面板('article')">
                <div class="func-count" id="cnt-article">0</div>
                <div class="func-emoji">📝</div>
                <div class="func-name">专栏导出</div>
                <div class="func-desc">导出B站专栏/图文动态信息与正文</div>
                <div class="func-accept">cv号 · 专栏链接 · opus动态链接</div>
            </div>

            <!-- Completed -->
            <div class="func-card card-done">
                <div class="done-title-row">
                    <div class="func-emoji">✅</div>
                    <div class="func-name">已完成</div>
                    <div class="func-count" id="cnt-done" style="position:static">0</div>
                </div>
                <div class="done-scroll" id="done-scroll"></div>
                <div class="done-ft">
                    <button class="btn btn-gh btn-xs" onclick="event.stopPropagation();清空完成()">清空</button>
                </div>
            </div>
        </div>

        <!-- ===== PANEL VIEW ===== -->
        <div class="main-area" id="view-panel" style="display:none">
            <div class="panel-wrap">
                <!-- Panel Header -->
                <div class="panel-top">
                    <button class="btn btn-pk" onclick="关闭面板()">← 返回</button>
                    <span class="panel-icon" id="p-icon">🎬</span>
                    <span class="panel-title" id="p-title">视频信息导出</span>
                    <span class="panel-type-hint" id="p-hint">BV号 · av号 · 视频链接</span>
                </div>

                <!-- Input Bar -->
                <div class="panel-input">
                    <div class="input-stack">
                        <input type="text" id="url-input" placeholder="输入链接或ID..."
                            onkeydown="if(event.key==='Enter')添加并获取()">
                        <textarea id="url-multi" style="display:none"
                            placeholder="每行一条；也可粘贴混排（逗号 / 分号 / 空格 / 回车）自动拆分。Ctrl+Enter 提交"></textarea>
                        <div class="input-count" id="url-count"></div>
                    </div>
                    <button class="btn btn-gh btn-plus" id="btn-multi" type="button" title="展开多行输入"
                        aria-expanded="false">+</button>
                    <button class="btn btn-or" onclick="添加并获取()">添加并获取</button>
                </div>

                <!-- 主体：列表与预览 -->
                <div class="panel-body">
                    <!-- List -->
                    <div class="panel-col">
                        <div class="panel-col-hd">
                            <h3>📋 列表</h3>
                            <div class="badge" id="p-badge">0</div>
                        </div>
                        <div class="panel-list" id="p-list"></div>
                        <div class="panel-col-ft">
                            <button class="btn btn-gh btn-xs" onclick="全选()">全选</button>
                            <button class="btn btn-gh btn-xs" onclick="取消选择()">取消</button>
                            <button class="btn btn-gh btn-xs" onclick="清空面板卡片()">清空</button>
                            <button class="btn btn-gh btn-xs" onclick="打开导出文件夹()" style="margin-left:auto">📂 打开文件夹</button>
                            <button class="btn btn-gn" onclick="导出选中()">导出选中</button>
                            <button class="btn btn-or" onclick="导出全部就绪()">导出全部</button>
                        </div>
                    </div>

                    <!-- 预览 -->
                    <div class="panel-col">
                        <div class="panel-col-hd">
                            <h3>📄 预览</h3>
                            <div class="panel-col-hd-right">
                                <button class="btn btn-gh btn-xs" id="btn-raw" onclick="切换原文()">原文</button>
                            </div>
                        </div>
                        <div class="preview-area">
                            <div class="empty-hint" id="prev-empty">
                                <span class="em-icon">📄</span>
                                点击左侧项目查看预览
                            </div>
                            <div id="prev-rich" class="md-rendered" style="display:none"></div>
                            <pre id="prev-raw" class="md-raw" style="display:none"></pre>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- LOG BAR -->
        <div class="logbar">
            <div class="log-msgs" id="log-msgs"></div>
        </div>
    </div>

    <div class="toast" id="toast"></div>

    <script src="/assets/batch.js"></script>
    <script>
        (function () {
            /* ===== 状态 ===== */
            let 当前面板 = null; // 'video' | 'user' | 'article' | null
            let _上次状态 = null;
            let 上次日志长度 = 0;
            let 显示原文 = false;
            const 已选编号 = new Set();

            const 面板配置 = {
                video: { icon: '🎬', title: '视频信息导出', hint: 'BV号 · av号 · 视频链接 · b23短链', placeholder: '输入BV号、av号或视频链接...' },
                user: { icon: '👤', title: '用户信息导出', hint: 'UID · 空间链接', placeholder: '输入UID或空间链接...' },
                article: { icon: '📝', title: '专栏导出', hint: 'cv号 · 专栏链接 · opus动态链接', placeholder: '输入cv号、专栏链接或opus动态链接...' },
            };

            /* ===== 辅助工具 ===== */
            const 取元素 = id => document.getElementById(id);
            function 转义网页(s) { const d = document.createElement('div'); d.textContent = s; return d.innerHTML; }
            function 转义属性(s) { return 转义网页(s || '').replace(/'/g, '&#39;').replace(/\\/g, '\\\\'); }

            let _提示计时器 = null;
            function 提示(msg, err) {
                const el = 取元素('toast'); if (_提示计时器) clearTimeout(_提示计时器);
                el.textContent = msg; el.className = 'toast show' + (err ? ' err' : '');
                _提示计时器 = setTimeout(() => el.className = 'toast', 2200);
            }

            /* ===== PANEL OPEN / CLOSE ===== */
            function 打开面板(type) {
                当前面板 = type;
                已选编号.clear();
                const cfg = 面板配置[type];
                取元素('p-icon').textContent = cfg.icon;
                取元素('p-title').textContent = cfg.title;
                取元素('p-hint').textContent = cfg.hint;
                取元素('url-input').placeholder = cfg.placeholder;
                批量框.设文本('');
                if (批量框.是否展开()) 批量框.设展开(false);
                取元素('view-grid').style.display = 'none';
                取元素('view-panel').style.display = '';
                取元素('hdr-back').href = 'javascript:void(0)';
                取元素('hdr-back').onclick = function (e) { e.preventDefault(); 关闭面板(); };
                重置预览();
                轮询();
            };

            function 关闭面板() {
                当前面板 = null;
                已选编号.clear();
                取元素('view-panel').style.display = 'none';
                取元素('view-grid').style.display = '';
                取元素('hdr-back').href = '/';
                取元素('hdr-back').onclick = null;
                轮询();
            };

            /* ===== ADD ===== */
            const 批量框 = 挂载批量输入({
                inputId: 'url-input',
                textareaId: 'url-multi',
                toggleId: 'btn-multi',
                countId: 'url-count',
                onSubmit: () => 添加并获取(),
            });

            async function 添加并获取() {
                const v = 批量框.当前文本().trim();
                if (!v) { 提示('请输入链接或ID', true); return; }

                const r = await (await fetch('/api/mdout/add', {
                    method: 'POST', headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ text: v, expect_type: 当前面板 })
                })).json();
                if (!r.ok) { 提示(r.error || '添加失败', true); return; }
                批量框.设文本('');
                if (r.added && r.added > 1) {
                    let msg = '已添加 ' + r.added + ' 条';
                    if (r.wrong_type) msg += '，跳过类型不符 ' + r.wrong_type;
                    提示(msg);
                } else {
                    提示('已添加');
                }
            };

            /* ===== ITEM CLICK / SELECT ===== */
            async function 点击项目(id) {
                if (已选编号.has(id)) 已选编号.delete(id); else 已选编号.add(id);
                await fetch('/api/mdout/select', {
                    method: 'POST', headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ card_id: id })
                });
                轮询();
            };

            function 全选() {
                if (!_上次状态) return;
                _上次状态.cards.filter(c => c.item_type === 当前面板).forEach(c => 已选编号.add(c.id));
                轮询();
            };
            function 取消选择() { 已选编号.clear(); 轮询(); };

            /* ===== EXPORT ===== */
            async function 导出选中() {
                const ids = [...已选编号].filter(id => {
                    const c = _上次状态?.cards?.find(x => x.id === id);
                    return c && c.status === 'ready';
                });
                if (!ids.length) { 提示('请选择就绪的项目', true); return; }
                const r = await (await fetch('/api/mdout/export', {
                    method: 'POST', headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ card_ids: ids })
                })).json();
                if (r.ok) { 已选编号.clear(); 提示('已导出 ' + r.exported + ' 项'); }
                else 提示(r.error || '导出失败', true);
            };

            async function 导出全部就绪() {
                // 只导出当前面板类型的项目
                if (!_上次状态) return;
                const ids = _上次状态.cards.filter(c => c.item_type === 当前面板 && c.status === 'ready').map(c => c.id);
                if (!ids.length) { 提示('没有可导出的项目', true); return; }
                const r = await (await fetch('/api/mdout/export', {
                    method: 'POST', headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ card_ids: ids })
                })).json();
                if (r.ok) { 已选编号.clear(); 提示('已导出 ' + r.exported + ' 项'); }
                else 提示(r.error || '导出失败', true);
            };

            /* ===== CLEAR ===== */
            async function 清空面板卡片() {
                if (!_上次状态) return;
                const ids = _上次状态.cards.filter(c => c.item_type === 当前面板).map(c => c.id);
                if (!ids.length) return;
                await fetch('/api/mdout/remove', {
                    method: 'POST', headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ card_ids: ids })
                });
                已选编号.clear();
                重置预览();
            };

            async function 清空完成() {
                await fetch('/api/mdout/clear-completed', { method: 'POST' });
            };

            async function 打开导出文件夹() {
                const r = await (await fetch('/api/mdout/open-folder', { method: 'POST' })).json();
                if (!r.ok) 提示(r.error || '无法打开文件夹', true);
            };

            async function 打开文件(path) {
                if (!path) { 提示('文件路径不存在', true); return; }
                const r = await (await fetch('/api/open-explorer', {
                    method: 'POST', headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ path: path })
                })).json();
                if (!r.ok) 提示(r.error || '无法打开', true);
            };

            /* ===== PREVIEW ===== */
            function 切换原文() {
                显示原文 = !显示原文;
                取元素('btn-raw').textContent = 显示原文 ? '富文本' : '原文';
                渲染预览(_上次状态?.selected_markdown || '');
            };

            function 重置预览() {
                取元素('prev-empty').style.display = '';
                取元素('prev-rich').style.display = 'none';
                取元素('prev-raw').style.display = 'none';
            }

            function 渲染预览(md) {
                if (!md) { 重置预览(); return; }
                取元素('prev-empty').style.display = 'none';
                if (显示原文) {
                    取元素('prev-rich').style.display = 'none';
                    取元素('prev-raw').style.display = '';
                    取元素('prev-raw').textContent = md;
                } else {
                    取元素('prev-raw').style.display = 'none';
                    取元素('prev-rich').style.display = '';
                    try { 取元素('prev-rich').innerHTML = marked.parse(md); }
                    catch (e) { 取元素('prev-rich').textContent = md; }
                }
            }

            /* ===== RENDER GRID ===== */
            function 渲染网格(state) {
                const cards = state.cards;
                const counts = { video: 0, user: 0, article: 0 };
                cards.forEach(c => { if (counts[c.item_type] !== undefined) counts[c.item_type]++; });

                ['video', 'user', 'article'].forEach(t => {
                    const el = 取元素('cnt-' + t);
                    el.textContent = counts[t];
                    el.classList.toggle('has', counts[t] > 0);
                });

                // 已完成列表
                const doneEl = 取元素('done-scroll');
                const completed = state.completed || [];
                取元素('cnt-done').textContent = completed.length;
                取元素('cnt-done').classList.toggle('has', completed.length > 0);

                const doneHtml = completed.length
                    ? completed.slice(-20).reverse().map(c =>
                        '<div class="done-item" ondblclick="打开文件(\'' + 转义属性(c.output_path) + '\')" title="双击打开文件"><b>✓</b> ' + 转义网页(c.title || c.filename || '—') + '</div>'
                    ).join('')
                    : '<div class="done-empty">暂无导出记录</div>';

                if (doneEl._lh !== doneHtml) {
                    doneEl.innerHTML = doneHtml;
                    doneEl._lh = doneHtml;
                }
            }

            /* ===== RENDER PANEL ===== */
            function 渲染面板(state) {
                if (!当前面板) return;
                const items = state.cards.filter(c => c.item_type === 当前面板);
                取元素('p-badge').textContent = items.length;

                const statusLabels = { pending: '等待中', fetching: '获取中...', ready: '就绪', failed: '失败' };
                const listHtml = items.length
                    ? items.map(c => {
                        const isSel = 已选编号.has(c.id);
                        const tcls = 'item-' + (c.item_type || 'video');
                        const stHtml = statusLabels[c.status]
                            ? '<div class="item-status ' + c.status + '">' + statusLabels[c.status] +
                            (c.status === 'failed' && c.error ? ': ' + 转义网页(c.error) : '') + '</div>'
                            : '';
                        return '<div class="item ' + tcls + (isSel ? ' sel' : '') + '" onclick="点击项目(\'' + c.id + '\')">' +
                            '<div class="item-title">' + 转义网页(c.title || c.input_text || '—') + '</div>' +
                            '<div class="item-sub">' + 转义网页(c.subtitle || c.id_value || '') + '</div>' +
                            stHtml + '</div>';
                    }).join('')
                    : '<div class="empty-hint"><span class="em-icon">📋</span>在上方输入链接添加</div>';

                const listEl = 取元素('p-list');
                if (listEl._lh !== listHtml) {
                    const st = listEl.scrollTop;
                    listEl.innerHTML = listHtml;
                    listEl.scrollTop = st;
                    listEl._lh = listHtml;
                }

                // 预览
                渲染预览(state.selected_markdown || '');

                // 清理失效选择
                const validIds = new Set(items.map(c => c.id));
                for (const id of 已选编号) { if (!validIds.has(id)) 已选编号.delete(id); }
            }

            /* ===== 日志 ===== */
            function 渲染日志(logs) {
                if (logs.length === 上次日志长度) return;
                const el = 取元素('log-msgs');
                logs.slice(上次日志长度).forEach(l => {
                    const d = document.createElement('div'); d.className = 'lm';
                    d.innerHTML = '<span class="lm-time">[' + 转义网页(l.time) + ']</span> <span class="lm-' + l.level + '">' + 转义网页(l.msg) + '</span>';
                    el.appendChild(d);
                });
                上次日志长度 = logs.length;
                el.scrollTop = el.scrollHeight;
            }

            /* ===== 轮询 ===== */
            async function 轮询() {
                try {
                    const r = await fetch('/api/mdout/state');
                    const s = await r.json();
                    _上次状态 = s;

                    渲染网格(s);
                    if (当前面板) 渲染面板(s);
                    渲染日志(s.logs);

                    取元素('st-fetch').textContent = s.cards.length;
                    取元素('st-done').textContent = (s.completed || []).length;
                } catch (e) { }
            }

            /* ===== BG STARS ===== */
            function 初始化背景() {
                const 画布 = 取元素('bg-cv'), 画笔 = 画布.getContext('2d');
                const 橙色 = '#F5A623', 粉色 = '#E85B8A';
                let 星星组 = [];

                function 调整尺寸() { 画布.width = innerWidth; 画布.height = innerHeight; }
                调整尺寸();
                window.addEventListener('resize', 调整尺寸);

                for (let i = 0; i < 28; i++) 星星组.push({
                    x: Math.random() * innerWidth, y: Math.random() * innerHeight,
                    sz: Math.random() * 10 + 4, r: Math.random() * Math.PI * 2,
                    rv: (Math.random() - .5) * .015, vy: Math.random() * .25 + .08, vx: (Math.random() - .5) * .2,
                    c: Math.random() > .5 ? 橙色 : 粉色, al: Math.random() * .35 + .15, phase: Math.random() * Math.PI * 2
                });

                function 绘制星星(x, y, r, sz, col, al) {
                    if (al < .01) return;
                    画笔.save(); 画笔.globalAlpha = al; 画笔.translate(x, y); 画笔.rotate(r); 画笔.beginPath();
                    for (let i = 0; i < 5; i++) {
                        const ao = i * 2 * Math.PI / 5 - Math.PI / 2, ai = ao + Math.PI / 5;
                        i ? 画笔.lineTo(Math.cos(ao) * sz, Math.sin(ao) * sz) : 画笔.moveTo(Math.cos(ao) * sz, Math.sin(ao) * sz);
                        画笔.lineTo(Math.cos(ai) * sz * .4, Math.sin(ai) * sz * .4);
                    }
                    画笔.closePath(); 画笔.fillStyle = col; 画笔.fill(); 画笔.restore();
                }

                (function 循环() {
                    画笔.clearRect(0, 0, 画布.width, 画布.height);
                    星星组.forEach(s => {
                        s.x += s.vx; s.y += s.vy; s.r += s.rv; s.phase += .012;
                        if (s.y > innerHeight + 20) { s.y = -20; s.x = Math.random() * innerWidth; }
                        if (s.x < -20) s.x = innerWidth + 20;
                        if (s.x > innerWidth + 20) s.x = -20;
                        绘制星星(s.x, s.y, s.r, s.sz, s.c, s.al * (.7 + .3 * Math.sin(s.phase)));
                    });
                    requestAnimationFrame(循环);
                })();
            }

            /* ===== INIT ===== */
            window.打开面板 = 打开面板;
            window.关闭面板 = 关闭面板;
            window.添加并获取 = 添加并获取;
            window.点击项目 = 点击项目;
            window.全选 = 全选;
            window.取消选择 = 取消选择;
            window.导出选中 = 导出选中;
            window.导出全部就绪 = 导出全部就绪;
            window.清空面板卡片 = 清空面板卡片;
            window.清空完成 = 清空完成;
            window.打开导出文件夹 = 打开导出文件夹;
            window.打开文件 = 打开文件;
            window.切换原文 = 切换原文;
            window.openPanel = 打开面板;
            window.closePanel = 关闭面板;
            window.addFetch = 添加并获取;
            window.clickItem = 点击项目;
            window.selAll = 全选;
            window.selNone = 取消选择;
            window.exportSelected = 导出选中;
            window.exportAllReady = 导出全部就绪;
            window.clearPanelCards = 清空面板卡片;
            window.clearDone = 清空完成;
            window.openExportFolder = 打开导出文件夹;
            window.openFile = 打开文件;
            window.toggleRaw = 切换原文;
            初始化背景();
            轮询();
            setInterval(轮询, 600);
        })();
    </script>
    <script src="/assets/entry.js"></script>
</body>
