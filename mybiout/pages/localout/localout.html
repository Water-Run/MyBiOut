<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=1200">
    <title>LocalOut! — MyBiOut!</title>
    <link rel="icon" href="/assets/logo.png" type="image/png">
    <link rel="stylesheet" href="/assets/entry.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        a {
            text-decoration: none;
            color: inherit;
        }

        ::-webkit-scrollbar {
            width: 6px;
        }

        ::-webkit-scrollbar-track {
            background: transparent;
        }

        ::-webkit-scrollbar-thumb {
            background: #E85B8A;
            border-radius: 3px;
        }

        body {
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            background: url('/assets/bg.png') center center / cover no-repeat fixed;
            font-family: "Microsoft YaHei", "Segoe UI", system-ui, sans-serif;
            cursor: default;
            -webkit-font-smoothing: antialiased;
        }

        #bg-cv {
            position: fixed;
            inset: 0;
            z-index: 0;
            pointer-events: none;
        }

        .page {
            position: relative;
            z-index: 1;
            width: 1200px;
            height: 100vh;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            padding: 18px 20px 14px;
        }

        /* ===== HEADER ===== */
        .hdr {
            display: flex;
            align-items: center;
            gap: 22px;
            margin-bottom: 14px;
            flex-shrink: 0;
            background: #FB7299;
            padding: 10px 16px;
            border: 3px solid #e45a84;
            box-shadow: 4px 4px 0 #F5A623;
        }

        .back {
            background: #fff;
            color: #FB7299;
            font-size: 13px;
            font-weight: 700;
            padding: 8px 18px;
            border: 3px solid #e45a84;
            box-shadow: 4px 4px 0 #F5A623;
            transition: transform .12s, box-shadow .12s;
        }

        .back:hover {
            transform: translate(2px, 2px);
            box-shadow: 2px 2px 0 #F5A623;
        }

        .hdr h1 {
            font-size: 32px;
            font-weight: 900;
            color: #fff;
            text-shadow: 2px 2px 0 #e45a84;
            transform: rotate(-0.6deg);
        }

        .hdr-stats {
            margin-left: auto;
            font-size: 13px;
            font-weight: 700;
            color: #E85B8A;
            display: flex;
            gap: 16px;
        }

        .hdr-stats span {
            color: #F5A623;
        }

        /* ===== ENV STATUS BAR ===== */
        #env-bar {
            flex-shrink: 0;
            font-weight: 600;
            letter-spacing: 0.3px;
        }

        #env-bar-icon {
            margin-right: 6px;
        }

        /* ===== COLUMNS ===== */
        .cols {
            flex: 1;
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 16px;
            min-height: 0;
        }

        .col {
            background: rgba(255, 255, 255, .92);
            backdrop-filter: blur(10px);
            border: 3px solid #F5A623;
            box-shadow: 5px 5px 0 #E85B8A;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            transition: transform .22s;
        }

        .col:hover {
            transform: rotate(0deg) !important;
        }

        .col:nth-child(1) {
            transform: rotate(-0.4deg);
        }

        .col:nth-child(2) {
            transform: rotate(0.25deg);
        }

        .col:nth-child(3) {
            transform: rotate(-0.3deg);
        }

        .col-hd {
            padding: 12px 14px 8px;
            border-bottom: 3px dashed #F5A623;
            display: flex;
            align-items: center;
            gap: 10px;
            flex-shrink: 0;
        }

        .col-hd h2 {
            font-size: 17px;
            font-weight: 900;
            color: #E85B8A;
            white-space: nowrap;
        }

        .col-hd .badge {
            background: #F5A623;
            color: #fff;
            font-size: 11px;
            font-weight: 700;
            padding: 2px 8px;
            border: 2px solid #d48b0e;
            min-width: 24px;
            text-align: center;
        }

        .col-hd-right {
            margin-left: auto;
            display: flex;
            gap: 6px;
            align-items: center;
        }

        @keyframes spin {
            from {
                transform: rotate(0deg);
            }

            to {
                transform: rotate(360deg);
            }
        }

        .scan-spin {
            display: inline-block;
            font-size: 15px;
            animation: spin 1.5s linear infinite;
        }

        .scan-spin.hidden {
            display: none;
        }

        .col-search {
            padding: 8px 12px;
            flex-shrink: 0;
        }

        .col-search input {
            width: 100%;
            padding: 6px 10px;
            border: 2px solid #F5A623;
            font-size: 13px;
            font-family: inherit;
            outline: none;
            background: #fff;
            transition: border-color .2s;
        }

        .col-search input:focus {
            border-color: #E85B8A;
        }

        .export-modes {
            margin: -2px 12px 6px;
            padding: 6px 8px;
            border: 2px dashed rgba(232, 91, 138, .35);
            background: rgba(251, 114, 153, .05);
            display: flex;
            align-items: center;
            gap: 10px;
            flex-shrink: 0;
            font-size: 10px;
            font-weight: 700;
            color: #666;
        }

        .export-modes label {
            display: flex;
            align-items: center;
            gap: 4px;
            cursor: pointer;
            white-space: nowrap;
        }

        .export-modes input {
            accent-color: #E85B8A;
        }

        .export-modes a {
            margin-left: auto;
            color: #E85B8A;
        }

        .card-list {
            flex: 1;
            overflow-y: auto;
            padding: 6px 12px;
        }

        /* ===== CARD ===== */
        .card {
            background: #fff;
            border: 2px solid #eee;
            padding: 10px 12px;
            margin-bottom: 8px;
            cursor: pointer;
            position: relative;
            transition: border-color .18s, box-shadow .18s, transform .18s, background .18s;
            border-left: 4px solid #ccc;
        }

        .card:hover {
            transform: translateX(3px);
            box-shadow: 0 3px 10px rgba(232, 91, 138, .15);
            border-color: #F5A623;
        }

        .card.sel {
            background: rgba(245, 166, 35, .06);
            border-color: #E85B8A;
            border-left-color: #E85B8A !important;
        }

        .card.sel::after {
            content: "";
            position: absolute;
            top: 0;
            right: 0;
            border: 10px solid transparent;
            border-top-color: #E85B8A;
            border-right-color: #E85B8A;
        }

        .card-pc {
            border-left-color: #8e44ad;
        }

        .card-local {
            border-left-color: #2980b9;
        }

        .card-drive {
            border-left-color: #27ae60;
        }

        .card-adb {
            border-left-color: #e67e22;
        }

        .card-title {
            font-size: 14px;
            font-weight: 700;
            color: #333;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            margin-bottom: 3px;
            padding-right: 22px;
        }

        .card-meta {
            font-size: 12px;
            color: #888;
            line-height: 1.6;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .card-meta b {
            color: #E85B8A;
            font-weight: 600;
        }

        .card-src-tag {
            display: inline-block;
            font-size: 10px;
            padding: 1px 6px;
            background: #F5A623;
            color: #fff;
            font-weight: 700;
            margin-top: 4px;
        }

        .card-status {
            font-size: 11px;
            font-weight: 700;
            margin-top: 4px;
            padding: 2px 6px;
            display: inline-block;
        }

        .card-status.queued {
            background: #f0f0f0;
            color: #888;
        }

        .card-status.exporting {
            background: linear-gradient(90deg, #E85B8A, #F5A623, #E85B8A);
            background-size: 200% auto;
            color: #fff;
            animation: shimmer 1.5s linear infinite;
        }

        .card-status.success {
            background: #27ae60;
            color: #fff;
        }

        .card-status.skipped {
            background: #2980b9;
            color: #fff;
        }

        .card-status.failed {
            background: #e74c3c;
            color: #fff;
        }

        .card-row {
            display: flex;
            gap: 10px;
            align-items: flex-start;
        }

        .card-cover {
            width: 84px;
            height: 56px;
            flex-shrink: 0;
            object-fit: cover;
            border: 1px solid #eee;
            background: #fafafa;
        }

        .card-cover-empty {
            display: flex;
            align-items: center;
            justify-content: center;
            color: #ccc;
            font-size: 18px;
            font-weight: 700;
        }

        .card-body {
            flex: 1;
            min-width: 0;
        }

        .card-path {
            font-size: 11px;
            color: #aaa;
            margin-top: 4px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            font-family: "Cascadia Code", "Consolas", monospace;
        }

        .card-removed {
            opacity: 0.55;
            text-decoration: line-through;
            background: repeating-linear-gradient(45deg,
                    transparent,
                    transparent 8px,
                    rgba(231, 76, 60, .06) 8px,
                    rgba(231, 76, 60, .06) 16px);
        }

        .card-removed .card-title,
        .card-removed .card-meta,
        .card-removed .card-path {
            text-decoration: line-through;
        }

        /* ===== DELETE BUTTON ===== */
        .btn-del {
            position: absolute;
            top: 6px;
            right: 8px;
            background: none;
            border: none;
            color: #ccc;
            font-size: 14px;
            line-height: 1;
            padding: 1px 4px;
            cursor: pointer;
            z-index: 2;
            transition: color .15s;
        }

        .btn-del:hover {
            color: #e74c3c;
        }

        @keyframes shimmer {
            0% {
                background-position: 0% center;
            }

            100% {
                background-position: 200% center;
            }
        }

        /* ===== FOOTER ===== */
        .col-ft {
            padding: 8px 12px;
            border-top: 2px solid rgba(245, 166, 35, .2);
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
            flex-shrink: 0;
            align-items: center;
        }

        /* ===== BUTTONS ===== */
        .btn {
            padding: 5px 12px;
            font-size: 12px;
            font-weight: 700;
            border: 2px solid;
            cursor: pointer;
            font-family: inherit;
            white-space: nowrap;
            transition: transform .1s, box-shadow .1s, opacity .2s;
        }

        .btn:active {
            transform: translate(1px, 1px) !important;
        }

        .btn:disabled {
            opacity: .4;
            cursor: not-allowed;
        }

        .btn-pk {
            background: #E85B8A;
            color: #fff;
            border-color: #c44876;
            box-shadow: 3px 3px 0 #F5A623;
        }

        .btn-or {
            background: #F5A623;
            color: #fff;
            border-color: #d48b0e;
            box-shadow: 3px 3px 0 #E85B8A;
        }

        .btn-gh {
            background: transparent;
            color: #E85B8A;
            border-color: #E85B8A;
            box-shadow: 2px 2px 0 #F5A623;
        }

        .btn-gn {
            background: #27ae60;
            color: #fff;
            border-color: #1e8449;
            box-shadow: 3px 3px 0 #F5A623;
        }

        .btn-dn {
            background: #e74c3c;
            color: #fff;
            border-color: #c0392b;
            box-shadow: 3px 3px 0 #888;
        }

        /* ===== DROPDOWN ===== */
        .dd-backdrop {
            display: none;
            position: fixed;
            inset: 0;
            z-index: 8999;
        }

        .dd-backdrop.open {
            display: block;
        }

        .dd-menu {
            display: none;
            position: fixed;
            z-index: 9000;
            background: #fff;
            border: 2px solid #F5A623;
            box-shadow: 4px 4px 0 #E85B8A;
            min-width: 320px;
            max-width: 460px;
            max-height: 400px;
            overflow-y: auto;
        }

        .dd-menu.open {
            display: block;
        }

        .dd-item {
            padding: 10px 14px;
            font-size: 13px;
            color: #333;
            cursor: pointer;
            border-bottom: 1px solid #f5f5f5;
            transition: background .12s;
            display: flex;
            align-items: flex-start;
            gap: 10px;
        }

        .dd-item:hover {
            background: rgba(245, 166, 35, .12);
            color: #E85B8A;
        }

        .dd-item:last-child {
            border-bottom: none;
        }

        .dd-icon {
            font-size: 18px;
            flex-shrink: 0;
            line-height: 1.2;
        }

        .dd-body {
            flex: 1;
            min-width: 0;
        }

        .dd-name {
            font-weight: 600;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .dd-path {
            font-size: 11px;
            color: #aaa;
            margin-top: 2px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .dd-tag {
            display: inline-block;
            font-size: 9px;
            font-weight: 700;
            padding: 1px 5px;
            margin-top: 3px;
            color: #fff;
        }

        .dd-tag-adb {
            background: #e67e22;
        }

        .dd-tag-drive {
            background: #27ae60;
        }

        /* ===== LOG BAR ===== */
        .logbar {
            flex-shrink: 0;
            height: 120px;
            margin-top: 12px;
            display: flex;
            gap: 14px;
            background: rgba(30, 30, 40, .88);
            backdrop-filter: blur(8px);
            border: 3px solid #F5A623;
            box-shadow: 5px 5px 0 #E85B8A;
            padding: 10px 16px;
            overflow: hidden;
        }

        .log-msgs {
            flex: 1;
            overflow-y: auto;
            font-size: 12px;
            line-height: 1.7;
            font-family: "Cascadia Code", "Consolas", "Courier New", monospace;
        }

        .log-msgs::-webkit-scrollbar-thumb {
            background: #F5A623;
        }

        .lm {
            opacity: 0;
            animation: logIn .3s ease-out forwards;
        }

        @keyframes logIn {
            from {
                opacity: 0;
                transform: translateX(-12px);
            }

            to {
                opacity: 1;
                transform: translateX(0);
            }
        }

        .lm-time {
            color: #666;
        }

        .lm-info {
            color: #F5A623;
        }

        .lm-success {
            color: #2ecc71;
        }

        .lm-warn {
            color: #f39c12;
        }

        .lm-error {
            color: #e74c3c;
        }

        .log-right {
            width: 180px;
            flex-shrink: 0;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: 8px;
        }

        .prog-bar {
            width: 100%;
            height: 18px;
            background: #333;
            border: 2px solid #F5A623;
            position: relative;
            overflow: hidden;
        }

        .prog-fill {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, #E85B8A, #F5A623, #E85B8A);
            background-size: 200% 100%;
            animation: shimmer 1.5s linear infinite;
            transition: width .3s ease;
        }

        .prog-text {
            position: absolute;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 11px;
            font-weight: 700;
            color: #fff;
            text-shadow: 1px 1px 2px rgba(0, 0, 0, .5);
        }

        .log-label {
            font-size: 11px;
            color: #888;
            font-weight: 700;
            text-align: center;
        }

        /* ===== TOAST ===== */
        .toast {
            position: fixed;
            bottom: 32px;
            right: 32px;
            padding: 10px 22px;
            background: #F5A623;
            color: #fff;
            font-weight: 700;
            font-size: 13px;
            border: 3px solid #d48b0e;
            box-shadow: 4px 4px 0 #E85B8A;
            z-index: 9999;
            opacity: 0;
            transform: translateY(12px);
            transition: opacity .25s, transform .25s;
            pointer-events: none;
        }

        .toast.show {
            opacity: 1;
            transform: translateY(0);
        }

        .toast.err {
            background: #E85B8A;
            border-color: #c44876;
            box-shadow: 4px 4px 0 #F5A623;
        }

        /* ===== RESTORE DIALOG ===== */
        .restore-layer {
            display: none;
            position: fixed;
            inset: 0;
            z-index: 9500;
            background: rgba(30, 30, 40, .58);
            align-items: center;
            justify-content: center;
            padding: 24px;
        }

        .restore-layer.open {
            display: flex;
        }

        .restore-dialog {
            width: 760px;
            max-height: calc(100vh - 48px);
            overflow-y: auto;
            background: #fff;
            border: 3px solid #F5A623;
            box-shadow: 7px 7px 0 #E85B8A;
        }

        .restore-head {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 14px 18px;
            background: #FB7299;
            color: #fff;
            border-bottom: 3px dashed #F5A623;
        }

        .restore-head h2 {
            font-size: 19px;
            font-weight: 900;
        }

        .restore-close {
            margin-left: auto;
            width: 32px;
            height: 32px;
            background: #fff;
            color: #E85B8A;
            border: 2px solid #c44876;
            font-size: 20px;
            font-weight: 900;
            cursor: pointer;
        }

        .restore-body {
            padding: 18px;
        }

        .restore-field {
            margin-bottom: 16px;
        }

        .restore-field label {
            display: block;
            margin-bottom: 6px;
            color: #555;
            font-size: 12px;
            font-weight: 800;
        }

        .restore-row {
            display: flex;
            align-items: stretch;
            gap: 8px;
        }

        .restore-row input,
        .restore-row select {
            flex: 1;
            min-width: 0;
            height: 36px;
            padding: 6px 10px;
            border: 2px solid #F5A623;
            background: #fff;
            color: #333;
            font-family: inherit;
            font-size: 12px;
            outline: none;
        }

        .restore-row input:focus,
        .restore-row select:focus {
            border-color: #E85B8A;
        }

        .restore-list-tools {
            display: flex;
            align-items: center;
            gap: 8px;
            margin: 10px 0 6px;
        }

        .restore-list-tools .restore-count {
            margin-left: auto;
            color: #777;
            font-size: 12px;
            font-weight: 800;
        }

        .restore-list {
            min-height: 96px;
            max-height: 270px;
            overflow-y: auto;
            border: 2px solid #F5A623;
            background: #fafafa;
        }

        .restore-list-empty {
            padding: 34px 12px;
            color: #aaa;
            font-size: 12px;
            font-weight: 700;
            text-align: center;
        }

        .restore-item {
            display: grid;
            grid-template-columns: 20px minmax(0, 1fr) auto;
            gap: 9px;
            align-items: center;
            padding: 9px 10px;
            border-bottom: 1px dashed rgba(232, 91, 138, .35);
            cursor: pointer;
        }

        .restore-item:last-child {
            border-bottom: 0;
        }

        .restore-item:hover {
            background: #fff5f8;
        }

        .restore-item input {
            width: 15px;
            height: 15px;
            accent-color: #E85B8A;
        }

        .restore-item-main {
            min-width: 0;
        }

        .restore-item-title {
            overflow: hidden;
            color: #333;
            font-size: 12px;
            font-weight: 800;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .restore-item-meta {
            margin-top: 2px;
            overflow: hidden;
            color: #888;
            font-size: 11px;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .restore-item-status {
            max-width: 170px;
            padding: 3px 6px;
            color: #777;
            font-size: 10px;
            font-weight: 800;
            text-align: right;
        }

        .restore-item-status.success { color: #1e8449; }
        .restore-item-status.failed { color: #c0392b; }
        .restore-item-status.skipped,
        .restore-item-status.cancelled { color: #d68910; }
        .restore-item-status.restoring { color: #E85B8A; }

        .restore-message {
            min-height: 42px;
            padding: 10px 12px;
            border: 2px dashed rgba(232, 91, 138, .45);
            background: rgba(251, 114, 153, .05);
            color: #666;
            font-size: 12px;
            line-height: 1.6;
        }

        .restore-message.error {
            color: #c0392b;
            border-color: #e74c3c;
            background: #fff5f4;
        }

        .restore-message.success {
            color: #1e8449;
            border-color: #27ae60;
            background: #f3fbf6;
        }

        .restore-progress {
            height: 16px;
            margin-top: 8px;
            border: 2px solid #F5A623;
            background: #eee;
            overflow: hidden;
        }

        .restore-progress-fill {
            width: 0;
            height: 100%;
            background: #E85B8A;
            transition: width .25s ease;
        }

        .restore-foot {
            display: flex;
            justify-content: flex-end;
            gap: 10px;
            padding: 12px 18px 16px;
            border-top: 2px dashed rgba(245, 166, 35, .55);
        }

        .empty-hint {
            text-align: center;
            padding: 40px 10px;
            color: #ccc;
            font-size: 14px;
            font-weight: 700;
        }

        .empty-hint .em-icon {
            font-size: 38px;
            display: block;
            margin-bottom: 8px;
        }

    </style>
</head>

<body>

    <div class="mybiout-entry-overlay" aria-hidden="true">
        <canvas class="mybiout-entry-canvas"></canvas>
        <div class="mybiout-entry-stage">
            <div class="mybiout-entry-core"></div>
        </div>
    </div>
    <canvas id="bg-cv"></canvas>
    <div class="page">
        <!-- HEADER -->
        <div class="hdr">
            <a class="back" href="/">← 首页</a>
            <h1>LocalOut!</h1>
            <div class="hdr-stats">
                <div>源 <span id="st-src">0</span></div>
                <div>任务 <span id="st-task">0</span></div>
                <div>完成 <span id="st-done">0</span></div>
            </div>
        </div>

        <!-- ENV STATUS BAR -->
        <div id="env-bar" style="display:none;background:#fff3cd;border:2px solid #ffc107;padding:8px 14px;margin-bottom:10px;font-size:12px;color:#856404;box-shadow:3px 3px 0 #E85B8A;">
            <span id="env-bar-icon">⚠️</span>
            <span id="env-bar-text"></span>
        </div>

        <!-- COLUMNS -->
        <div class="cols">
            <!-- SOURCE -->
            <div class="col">
                <div class="col-hd">
                    <h2>🔍 源</h2>
                    <div class="badge" id="badge-src">0</div>
                    <span class="scan-spin hidden" id="scan-spin">✦</span>
                    <div class="col-hd-right">
                        <button class="btn btn-dn" id="btn-pause-scan" onclick="暂停扫描()" style="display:none">暂停扫描</button>
                        <button class="btn btn-gn" id="btn-resume-scan" onclick="继续扫描()" style="display:none">继续扫描</button>
                        <button class="btn btn-dn" id="btn-cancel-scan" onclick="取消扫描()" style="display:none">取消扫描</button>
                        <button class="btn btn-or" id="btn-add-src" onclick="切换下拉()">选择源 ▼</button>
                    </div>
                </div>
                <div class="col-search"><input placeholder="搜索标题 / UP主 / BV号..." id="src-search"></div>
                <div class="card-list" id="src-cards"></div>
                <div class="col-ft">
                    <button class="btn btn-gh" onclick="全选('src')">全选</button>
                    <button class="btn btn-gh" onclick="取消选择('src')">取消</button>
                    <button class="btn btn-gh" onclick="清空来源()">清空</button>
                    <button class="btn btn-pk" onclick="加入任务()" style="margin-left:auto">→ 添加到任务</button>
                </div>
            </div>

            <!-- TASKS -->
            <div class="col">
                <div class="col-hd">
                    <h2>📋 任务</h2>
                    <div class="badge" id="badge-task">0</div>
                    <div class="col-hd-right">
                        <button class="btn btn-or" id="btn-open-restore" onclick="打开恢复窗口()">↶ 恢复缓存</button>
                        <button class="btn btn-dn" id="btn-cancel-exp" onclick="取消导出()"
                            style="display:none">取消导出</button>
                    </div>
                </div>
                <div class="col-search"><input placeholder="搜索..." id="task-search"></div>
                <div class="export-modes" aria-label="导出选项">
                    <label title="发现同一稿件与分P已有成品时不再重复合并">
                        <input type="checkbox" id="quick-skip-duplicates" onchange="保存导出开关('skip_duplicates',this.checked)">
                        智能去重
                    </label>
                    <label title="把 MP4 与缓存元文件放入同名归档文件夹">
                        <input type="checkbox" id="quick-preserve-metadata" onchange="保存导出开关('preserve_metadata',this.checked)">
                        元文件归档
                    </label>
                    <a href="/ohmyconfig" title="打开完整设置">设置 ↗</a>
                </div>
                <div class="card-list" id="task-cards"></div>
                <div class="col-ft">
                    <button class="btn btn-gh" onclick="全选('task')">全选</button>
                    <button class="btn btn-gh" onclick="取消选择('task')">取消</button>
                    <button class="btn btn-gh" onclick="清空任务()">清空</button>
                    <button class="btn btn-gn" onclick="开始导出()" style="margin-left:auto" id="btn-export">▶
                        开始导出</button>
                </div>
            </div>

            <!-- COMPLETED -->
            <div class="col">
                <div class="col-hd">
                    <h2>✅ 完成</h2>
                    <div class="badge" id="badge-done">0</div>
                </div>
                <div class="col-search"><input placeholder="搜索..." id="done-search"></div>
                <div class="card-list" id="done-cards"></div>
                <div class="col-ft">
                    <button class="btn btn-gh" onclick="清空完成()">清空</button>
                </div>
            </div>
        </div>

        <!-- LOG BAR -->
        <div class="logbar">
            <div class="log-msgs" id="log-msgs"></div>
            <div class="log-right">
                <div class="log-label" id="prog-label">就绪</div>
                <div class="prog-bar">
                    <div class="prog-fill" id="prog-fill"></div>
                    <div class="prog-text" id="prog-text">0%</div>
                </div>
            </div>
        </div>
    </div>

    <div class="dd-backdrop" id="dd-backdrop" onclick="关闭下拉()"></div>
    <div class="dd-menu" id="dd-menu"></div>
    <div class="restore-layer" id="restore-layer" role="dialog" aria-modal="true" aria-labelledby="restore-title">
        <div class="restore-dialog">
            <div class="restore-head">
                <h2 id="restore-title">恢复手机缓存</h2>
                <button class="restore-close" onclick="关闭恢复窗口()" title="关闭" aria-label="关闭">×</button>
            </div>
            <div class="restore-body">
                <div class="restore-field">
                    <label for="restore-path">电脑存档文件夹或上级目录</label>
                    <div class="restore-row">
                        <input id="restore-path" readonly placeholder="可选择改名后的导出目录，程序会递归识别有效归档">
                        <button class="btn btn-or" id="btn-browse-restore" onclick="选择恢复归档()">扫描文件夹</button>
                    </div>
                </div>
                <div class="restore-list-tools">
                    <button class="btn btn-gh" id="btn-select-all-restore" onclick="全选恢复归档()">全选</button>
                    <button class="btn btn-gh" id="btn-select-none-restore" onclick="取消选择恢复归档()">取消选择</button>
                    <span class="restore-count" id="restore-count">尚未扫描</span>
                </div>
                <div class="restore-list" id="restore-list">
                    <div class="restore-list-empty">选择文件夹后，将在这里列出可恢复归档</div>
                </div>
                <div class="restore-field" style="margin-top:16px">
                    <label for="restore-device">目标手机与客户端</label>
                    <div class="restore-row">
                        <select id="restore-device" onchange="更新恢复按钮()">
                            <option value="">正在检测设备...</option>
                        </select>
                        <button class="btn btn-gh" id="btn-refresh-restore" onclick="刷新恢复设备()">刷新</button>
                    </div>
                </div>
                <div class="restore-message" id="restore-message">请选择存档与目标手机。</div>
                <div class="restore-progress" aria-label="恢复进度">
                    <div class="restore-progress-fill" id="restore-progress-fill"></div>
                </div>
            </div>
            <div class="restore-foot">
                <button class="btn btn-gh" onclick="关闭恢复窗口()">关闭</button>
                <button class="btn btn-dn" id="btn-cancel-restore" onclick="取消恢复缓存()" style="display:none">取消恢复</button>
                <button class="btn btn-gn" id="btn-start-restore" onclick="开始恢复缓存()" disabled>↶ 批量恢复</button>
            </div>
        </div>
    </div>
    <div class="toast" id="toast"></div>

    <script>
        (function () {
            /* ===== 状态 ===== */
            const 已选来源 = new Set(), 已选任务 = new Set();
            let 上次日志长度 = 0, 下拉已开 = false, _上次状态 = null;
            const _已移除编号 = new Set(); // 已消失设备对应的卡片 id
            let _上次可用键 = new Set();
            let _设备刷新中 = false;
            let _恢复归档列表 = [], _恢复设备列表 = [], _上次恢复状态 = 'idle';
            const _已选恢复归档 = new Set();

            /* ===== TOAST ===== */
            let _提示计时器 = null;
            function 提示(msg, err) {
                const el = 取元素('toast');
                if (_提示计时器) clearTimeout(_提示计时器);
                el.textContent = msg;
                el.className = 'toast show' + (err ? ' err' : '');
                _提示计时器 = setTimeout(() => { el.className = 'toast'; }, 2200);
            }

            /* ===== 辅助工具 ===== */
            const 取元素 = id => document.getElementById(id);
            function 转义网页(s) { const d = document.createElement('div'); d.textContent = s; return d.innerHTML; }
            function 转义属性(s) { return 转义网页(s || '').replace(/'/g, '&#39;'); }

            /* ===== RESTORE ===== */
            async function 打开恢复窗口() {
                取元素('restore-layer').classList.add('open');
                await 刷新恢复设备();
                更新恢复按钮();
            }

            function 关闭恢复窗口() {
                取元素('restore-layer').classList.remove('open');
            }

            function 设置恢复消息(消息, 类型 = '') {
                const el = 取元素('restore-message');
                el.textContent = 消息;
                el.className = 'restore-message' + (类型 ? ' ' + 类型 : '');
            }

            async function 选择恢复归档() {
                提示('请选择存档文件夹或其上级目录');
                const data = await (await fetch('/api/localout/restore/browse', { method: 'POST' })).json();
                if (!data.ok || !data.path) return;
                取元素('restore-path').value = data.path;
                await 扫描恢复归档(data.path);
            }

            async function 扫描恢复归档(path) {
                _恢复归档列表 = [];
                _已选恢复归档.clear();
                渲染恢复归档列表();
                设置恢复消息('正在递归扫描有效归档...');
                const data = await (await fetch('/api/localout/restore/scan', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ path })
                })).json();
                if (!data.ok) {
                    设置恢复消息(data.error || '存档扫描失败', 'error');
                    更新恢复按钮();
                    return;
                }
                _恢复归档列表 = data.archives || [];
                _恢复归档列表.forEach(item => _已选恢复归档.add(item.id));
                渲染恢复归档列表();
                const warningText = (data.warnings || []).length ? `；另跳过 ${data.warnings.length} 个不完整目录` : '';
                if (_恢复归档列表.length) {
                    设置恢复消息(`找到 ${_恢复归档列表.length} 个有效归档${warningText}。同一 avid 的多个分集会合并后导入。`, 'success');
                } else {
                    设置恢复消息(`没有找到有效归档${warningText}`, 'error');
                }
                更新恢复按钮();
            }

            function 渲染恢复归档列表() {
                const 运行项目 = new Map((_上次状态?.restore_items || []).map(item => [item.id, item]));
                const 正在恢复 = _上次状态?.restore_status === 'restoring';
                const 状态文字 = {
                    queued: '等待恢复', restoring: '处理中', success: '已完成',
                    skipped: '已跳过', failed: '失败', cancelled: '已取消'
                };
                const items = _恢复归档列表;
                取元素('restore-list').innerHTML = items.length ? items.map(item => {
                    const runtime = 运行项目.get(item.id) || item;
                    const status = runtime.status || '';
                    const statusText = runtime.message || 状态文字[status] || '';
                    return `<label class="restore-item">
                        <input type="checkbox" ${_已选恢复归档.has(item.id) ? 'checked' : ''}
                            ${正在恢复 ? 'disabled' : ''} onchange="切换恢复归档('${item.id}',this.checked)">
                        <span class="restore-item-main">
                            <span class="restore-item-title">${转义网页(item.title || item.mp4_name || '未知归档')}</span>
                            <span class="restore-item-meta">${转义网页(item.cache_path || '')} · ${item.size_mb || 0} MB</span>
                        </span>
                        <span class="restore-item-status ${status}">${转义网页(statusText)}</span>
                    </label>`;
                }).join('') : '<div class="restore-list-empty">没有可恢复归档</div>';
                const avid数量 = new Set(items.filter(item => _已选恢复归档.has(item.id)).map(item => item.avid)).size;
                取元素('restore-count').textContent = `已选 ${_已选恢复归档.size}/${items.length} · ${avid数量} 个 avid`;
            }

            function 切换恢复归档(id, checked) {
                checked ? _已选恢复归档.add(id) : _已选恢复归档.delete(id);
                渲染恢复归档列表();
                更新恢复按钮();
            }

            function 全选恢复归档() {
                _恢复归档列表.forEach(item => _已选恢复归档.add(item.id));
                渲染恢复归档列表();
                更新恢复按钮();
            }

            function 取消选择恢复归档() {
                _已选恢复归档.clear();
                渲染恢复归档列表();
                更新恢复按钮();
            }

            async function 刷新恢复设备() {
                const select = 取元素('restore-device');
                const button = 取元素('btn-refresh-restore');
                button.disabled = true;
                select.innerHTML = '<option value="">正在检测设备...</option>';
                try {
                    const data = await (await fetch('/api/localout/restore/devices', { cache: 'no-store' })).json();
                    _恢复设备列表 = data.devices || [];
                    if (_恢复设备列表.length) {
                        select.innerHTML = _恢复设备列表.map(device =>
                            `<option value="${转义属性(device.id)}">${转义网页(device.label)} · ${转义网页(device.path)}</option>`
                        ).join('');
                    } else {
                        select.innerHTML = '<option value="">未检测到可用设备</option>';
                    }
                    if ((data.warnings || []).length && !_恢复设备列表.length) {
                        设置恢复消息(data.warnings.join('；'), 'error');
                    }
                } catch (e) {
                    _恢复设备列表 = [];
                    select.innerHTML = '<option value="">设备检测失败</option>';
                    设置恢复消息('设备检测失败: ' + (e.message || '网络错误'), 'error');
                } finally {
                    button.disabled = false;
                    更新恢复按钮();
                }
            }

            function 更新恢复按钮() {
                const 正在恢复 = _上次状态?.restore_status === 'restoring';
                取元素('btn-start-restore').disabled = !_已选恢复归档.size || !取元素('restore-device').value || 正在恢复;
                取元素('btn-browse-restore').disabled = 正在恢复;
                取元素('btn-refresh-restore').disabled = 正在恢复;
                取元素('restore-device').disabled = 正在恢复;
                取元素('btn-select-all-restore').disabled = 正在恢复 || !_恢复归档列表.length;
                取元素('btn-select-none-restore').disabled = 正在恢复 || !_恢复归档列表.length;
                取元素('btn-cancel-restore').style.display = 正在恢复 ? '' : 'none';
            }

            async function 开始恢复缓存() {
                const device = _恢复设备列表.find(item => item.id === 取元素('restore-device').value);
                const 选中归档 = _恢复归档列表.filter(item => _已选恢复归档.has(item.id));
                if (!选中归档.length) { 提示('请先选择有效归档', true); return; }
                if (!device) { 提示('请选择目标手机', true); return; }
                const data = await (await fetch('/api/localout/restore/start', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        paths: 选中归档.map(item => item.path),
                        serial: device.serial,
                        package: device.package,
                        layout: device.layout
                    })
                })).json();
                if (!data.ok) {
                    设置恢复消息(data.error || '无法开始恢复', 'error');
                    提示(data.error || '无法开始恢复', true);
                    return;
                }
                设置恢复消息(`准备批量恢复 ${data.valid || 选中归档.length} 个归档...`);
                提示('批量恢复已开始');
                轮询();
            }

            async function 取消恢复缓存() {
                const data = await (await fetch('/api/localout/restore/cancel', { method: 'POST' })).json();
                if (!data.ok) 提示(data.error || '无法取消恢复', true);
                else 提示('将在当前 avid 处理完成后停止');
            }

            function 更新恢复状态(s) {
                const status = s.restore_status || 'idle';
                取元素('restore-progress-fill').style.width = ((s.restore_progress || 0) * 100) + '%';
                if ((s.restore_items || []).length) 渲染恢复归档列表();
                if (status === 'restoring') {
                    设置恢复消息(`${s.restore_message || '正在恢复...'} · ${s.restore_done || 0}/${s.restore_total || 0}`);
                } else if (status === 'success') {
                    设置恢复消息(s.restore_message || '批量恢复完成', 'success');
                } else if (status === 'partial') {
                    设置恢复消息(s.restore_message || '批量恢复结束，部分项目未完成', 'error');
                } else if (status === 'cancelled') {
                    设置恢复消息(s.restore_message || '批量恢复已取消', 'error');
                } else if (status === 'error') {
                    设置恢复消息(s.restore_error || '恢复失败', 'error');
                }
                if (status !== _上次恢复状态) {
                    if (status === 'success') 提示('所选缓存已批量导入手机');
                    if (status === 'partial') 提示('批量恢复结束，部分项目未完成', true);
                    if (status === 'cancelled') 提示('批量恢复已取消', true);
                    if (status === 'error') 提示(s.restore_error || '缓存恢复失败', true);
                    _上次恢复状态 = status;
                }
                更新恢复按钮();
            }

            /* ===== DROPDOWN ===== */
            async function 切换下拉() {
                if (下拉已开) { 关闭下拉(); return; }
                const btn = 取元素('btn-add-src');
                const rect = btn.getBoundingClientRect();
                const menu = 取元素('dd-menu');
                menu.style.top = (rect.bottom + 4) + 'px';
                menu.style.left = rect.left + 'px';
                menu.innerHTML = '<div class="dd-item"><span class="dd-icon">⏳</span><div class="dd-body"><div class="dd-name" style="color:#aaa">加载中...</div></div></div>';
                menu.classList.add('open');
                取元素('dd-backdrop').classList.add('open');
                下拉已开 = true;

                try {
                    const r = await fetch('/api/localout/available-sources');
                    const data = await r.json();
                    const srcs = data.sources || [];
                    const warnings = data.warnings || [];

                    let html = '';

                    // 显示警告信息
                    if (warnings.length > 0) {
                        html += warnings.map(w =>
                            `<div class="dd-item" style="background:#fff3cd;cursor:default">
                                <span class="dd-icon">⚠️</span>
                                <div class="dd-body"><div class="dd-name" style="color:#856404;font-size:12px">${转义网页(w)}</div></div>
                            </div>`
                        ).join('');
                    }

                    // 显示源列表
                    html += srcs.map((s, sourceIndex) => {
                        const icon = 转义网页(s.icon || '📁');
                        if (s.type === 'browse') {
                            return `<div class="dd-item" data-source-index="${sourceIndex}">
                        <span class="dd-icon">${icon}</span>
                        <div class="dd-body"><div class="dd-name">${转义网页(s.label)}</div></div>
                    </div>`;
                        }
                        // 来源类型标签
                        let tagHtml = '';
                        if (s.type === 'adb') tagHtml = '<span class="dd-tag dd-tag-adb">ADB</span>';
                        if (s.type === 'drive') tagHtml = '<span class="dd-tag dd-tag-drive">MTP</span>';

                        return `<div class="dd-item" data-source-index="${sourceIndex}">
                    <span class="dd-icon">${icon}</span>
                    <div class="dd-body">
                        <div class="dd-name">${转义网页(s.label)}</div>
                        ${s.path ? '<div class="dd-path">' + 转义网页(s.path) + '</div>' : ''}
                        ${tagHtml}
                    </div>
                </div>`;
                    }).join('');

                    // 如果没有设备源，显示提示
                    const deviceSrcs = srcs.filter(s => s.type === 'drive' || s.type === 'adb');
                    if (deviceSrcs.length === 0 && warnings.length === 0) {
                        html += `<div class="dd-item" style="cursor:default">
                            <span class="dd-icon">💡</span>
                            <div class="dd-body"><div class="dd-name" style="color:#888;font-size:12px">未检测到 Android 设备，请检查连接</div></div>
                        </div>`;
                    }

                    menu.innerHTML = html;
                    menu.querySelectorAll('[data-source-index]').forEach(item => {
                        item.addEventListener('click', () => {
                            const source = srcs[Number(item.dataset.sourceIndex)];
                            if (!source) return;
                            if (source.type === 'browse') {
                                浏览本地();
                            } else {
                                添加来源(
                                    source.type || '',
                                    source.path || '',
                                    source.label || '',
                                    source.serial || '',
                                    source.package || ''
                                );
                            }
                        });
                    });
                } catch (e) {
                    menu.innerHTML = '<div class="dd-item"><span class="dd-icon">❌</span><div class="dd-body"><div class="dd-name" style="color:#e74c3c">加载失败: ' + 转义网页(e.message || '网络错误') + '</div></div></div>';
                }
            }
            function 关闭下拉() {
                取元素('dd-menu').classList.remove('open');
                取元素('dd-backdrop').classList.remove('open');
                下拉已开 = false;
            }
            window.切换下拉 = 切换下拉;
            window.关闭下拉 = 关闭下拉;

            async function 浏览本地() {
                关闭下拉();
                提示('请在弹出的窗口中选择目录');
                const r = await (await fetch('/api/localout/browse-local', { method: 'POST' })).json();
                if (r.ok && r.path) {
                    添加来源('local', r.path, '本地: ' + r.path, '', '');
                }
            }
            window.浏览本地 = 浏览本地;

            async function 添加来源(type, path, label, serial, pkg) {
                关闭下拉();
                const r = await (await fetch('/api/localout/add-source', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ source_type: type, path: path, label: label, serial: serial, package: pkg })
                })).json();
                if (!r.ok) 提示(r.error || '添加失败', true);
            }
            window.添加来源 = 添加来源;

            /* ===== SCAN CONTROLS ===== */
            async function 暂停扫描() { await fetch('/api/localout/pause-scan', { method: 'POST' }); 轮询(); }
            async function 继续扫描() { await fetch('/api/localout/resume-scan', { method: 'POST' }); 轮询(); }
            async function 取消扫描() { await fetch('/api/localout/cancel-scan', { method: 'POST' }); 轮询(); }
            async function 刷新设备可用性() {
                if (_设备刷新中) return;
                _设备刷新中 = true;
                try {
                    await fetch('/api/localout/available-sources', { cache: 'no-store' });
                } catch (e) {
                    // 轮询状态会保留最后一次可用结果；下次刷新自动重试。
                } finally {
                    _设备刷新中 = false;
                }
            }

            /* ===== CARD RENDERING ===== */
            function 渲染卡片(c, col) {
                const selSet = col === 'src' ? 已选来源 : col === 'task' ? 已选任务 : null;
                const isSel = selSet ? selSet.has(c.id) : false;
                const typeClass = 'card-' + (c.source_type || 'local');
                const removed = ((col === 'src' || col === 'task') && _已移除编号.has(c.id))
                    || (c.alive === false);

                let statusHtml = '';
                if (col === 'task' && c.status) {
                    const labels = { queued: '排队中', exporting: '导出中...', failed: '失败' };
                    if (c.status !== 'success' && labels[c.status]) {
                        statusHtml = `<div class="card-status ${c.status}">${labels[c.status]}${c.status === 'failed' && c.error ? ': ' + 转义网页(c.error) : ''}</div>`;
                    }
                }
                if (col === 'done') {
                    const doneClass = c.status === 'skipped' ? 'skipped' : 'success';
                    const doneText = c.status === 'skipped' ? '↷ 已跳过重复 · 打开已有文件' : '✓ 点击在资源管理器中打开';
                    statusHtml = `<div class="card-status ${doneClass}">${doneText}</div>`;
                }

                // 源/任务栏显示单卡片删除按钮
                const delBtn = (col === 'src' || col === 'task')
                    ? `<button class="btn-del" onclick="event.stopPropagation();删除卡片('${col}','${c.id}')" title="删除">✕</button>`
                    : '';

                const coverHtml = c.cover_url
                    ? `<img class="card-cover" src="${转义属性(c.cover_url)}" loading="lazy" onerror="this.style.display='none'">`
                    : `<div class="card-cover card-cover-empty">—</div>`;

                const partInfo = (c.part && c.part > 1) ? `P${c.part}` : '';
                const pathLine = c.path_display
                    ? `<div class="card-path" title="${转义属性(c.path_display)}">${转义网页(c.path_display)}</div>`
                    : '';

                const onClick = col === 'done'
                    ? `在资源管理器中打开卡片('${c.id}')`
                    : `切换卡片('${col}','${c.id}')`;

                return `<div class="card ${typeClass} ${isSel ? 'sel' : ''} ${removed ? 'card-removed' : ''}" data-id="${c.id}" onclick="${onClick}">
            ${delBtn}
            <div class="card-row">
                ${coverHtml}
                <div class="card-body">
                    <div class="card-title">${转义网页(c.title || c.folder_name || '未知视频')}</div>
                    <div class="card-meta"><b>${转义网页(c.up_name || '—')}</b>${partInfo ? ' · ' + partInfo : ''} · ${转义网页(c.quality || '—')} · ${c.size_mb || 0}MB</div>
                    <div class="card-meta">${转义网页(c.bvid || (c.avid ? 'av' + c.avid : ''))}${c.resolution ? ' · ' + 转义网页(c.resolution) : ''}${c.publish_time ? ' · ' + 转义网页(c.publish_time) : ''}</div>
                    ${pathLine}
                </div>
            </div>
            ${c.source_label && col !== 'src' ? '<div class="card-src-tag">' + 转义网页(c.source_label) + '</div>' : ''}
            ${statusHtml}
        </div>`;
            }

            async function 在资源管理器中打开(path) {
                if (!path) { 提示('路径为空', true); return; }
                const r = await (await fetch('/api/open-explorer', {
                    method: 'POST', headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ path })
                })).json();
                if (!r.ok) 提示(r.error || '无法打开', true);
            }
            function 在资源管理器中打开卡片(id) {
                const card = (_上次状态?.completed_cards || []).find(item => item.id === id);
                在资源管理器中打开(card?.output_path || card?.path_display || '');
            }

            function 渲染列(col, cards) {
                const container = 取元素(col + '-cards');
                const q = 取元素(col + '-search').value.toLowerCase();
                const filtered = q ? cards.filter(c =>
                    (c.title || '').toLowerCase().includes(q) ||
                    (c.up_name || '').toLowerCase().includes(q) ||
                    (c.bvid || '').toLowerCase().includes(q) ||
                    (c.folder_name || '').toLowerCase().includes(q)
                ) : cards;

                const emptyIcons = { src: '📂', task: '📋', done: '🎉' };
                const emptyTexts = {
                    src: '点击上方「选择源」开始',
                    task: '从源栏添加视频到这里',
                    done: '导出完成的视频将出现在这里',
                };
                const html = filtered.length
                    ? filtered.map(c => 渲染卡片(c, col)).join('')
                    : `<div class="empty-hint"><span class="em-icon">${emptyIcons[col]}</span>${emptyTexts[col]}</div>`;

                if (container._lh !== html) {
                    const st = container.scrollTop;
                    container.innerHTML = html;
                    container.scrollTop = st;
                    container._lh = html;
                }
            }

            function 切换卡片(col, id) {
                const s = col === 'src' ? 已选来源 : col === 'task' ? 已选任务 : null;
                if (!s) return;
                s.has(id) ? s.delete(id) : s.add(id);
                轮询();
            }

            /* ===== DELETE SINGLE CARD ===== */
            async function 删除卡片(col, id) {
                if (col === 'src') {
                    await fetch('/api/localout/remove-source', {
                        method: 'POST', headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ card_ids: [id] })
                    });
                    已选来源.delete(id);
                } else if (col === 'task') {
                    await fetch('/api/localout/remove-tasks', {
                        method: 'POST', headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ card_ids: [id] })
                    });
                    已选任务.delete(id);
                }
                轮询();
            }

            /* ===== SELECTION ===== */
            function 全选(col) {
                const s = col === 'src' ? 已选来源 : 已选任务;
                const cards = col === 'src' ? _上次状态?.source_cards : _上次状态?.task_cards;
                if (cards) cards.forEach(c => s.add(c.id));
                轮询();
            }
            function 取消选择(col) {
                (col === 'src' ? 已选来源 : 已选任务).clear();
                轮询();
            }

            /* ===== ACTIONS ===== */
            async function 加入任务() {
                const ids = [...已选来源];
                if (!ids.length) { 提示('请先在源栏选择视频', true); return; }
                const r = await (await fetch('/api/localout/add-to-tasks', {
                    method: 'POST', headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ card_ids: ids })
                })).json();
                if (r.ok) { 已选来源.clear(); 提示(`已添加 ${r.added} 个视频到任务`); }
            }

            async function 开始导出() {
                const ids = [...已选任务];
                const r = await (await fetch('/api/localout/start-export', {
                    method: 'POST', headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ card_ids: ids.length ? ids : [] })
                })).json();
                if (!r.ok) 提示(r.error || '无法导出', true);
                else { 已选任务.clear(); 提示('导出已开始'); }
            }

            async function 载入导出开关() {
                try {
                    const s = await (await fetch('/api/settings')).json();
                    取元素('quick-skip-duplicates').checked = (s.localout?.skip_duplicates ?? 'true') === 'true';
                    取元素('quick-preserve-metadata').checked = (s.localout?.preserve_metadata ?? 'false') === 'true';
                } catch (e) {
                    提示('导出选项读取失败，将使用默认值', true);
                }
            }

            async function 保存导出开关(key, checked) {
                const r = await fetch('/api/setting', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ section: 'localout', key, value: checked ? 'true' : 'false' })
                });
                const d = await r.json();
                if (!r.ok || !d.ok) {
                    提示(d.error || '选项保存失败', true);
                    await 载入导出开关();
                    return;
                }
                提示(key === 'skip_duplicates'
                    ? (checked ? '智能去重已开启' : '智能去重已关闭')
                    : (checked ? '元文件归档已开启' : '元文件归档已关闭'));
            }

            async function 取消导出() {
                await fetch('/api/localout/cancel-export', { method: 'POST' });
            }

            async function 清空来源() {
                await fetch('/api/localout/clear-source', { method: 'POST' });
                已选来源.clear();
            }
            async function 清空任务() {
                await fetch('/api/localout/clear-tasks', { method: 'POST' });
                已选任务.clear();
            }
            async function 清空完成() {
                await fetch('/api/localout/clear-completed', { method: 'POST' });
            }

            /* ===== LOG ===== */
            function 渲染日志(logs) {
                if (logs.length === 上次日志长度) return;
                const el = 取元素('log-msgs');
                logs.slice(上次日志长度).forEach(l => {
                    const d = document.createElement('div');
                    d.className = 'lm';
                    d.innerHTML = `<span class="lm-time">[${转义网页(l.time)}]</span> <span class="lm-${l.level}">${转义网页(l.msg)}</span>`;
                    el.appendChild(d);
                });
                上次日志长度 = logs.length;
                el.scrollTop = el.scrollHeight;
            }

            /* ===== PROGRESS ===== */
            function 更新进度(s) {
                let pct = 0, label = '就绪';
                if (s.scan_status === 'scanning' || s.scan_status === 'paused' || s.scan_status === 'cancelling') {
                    pct = s.scan_progress * 100;
                    label = s.scan_status === 'paused'
                        ? '扫描暂停'
                        : s.scan_status === 'cancelling' ? '正在取消扫描...' : '扫描中...';
                }
                if (s.export_status === 'exporting') {
                    pct = s.export_progress * 100;
                    label = `导出 ${s.export_done}/${s.export_total}`;
                }
                if (s.restore_status === 'restoring') {
                    pct = s.restore_progress * 100;
                    label = s.restore_message || '恢复缓存中...';
                }
                取元素('prog-fill').style.width = pct + '%';
                取元素('prog-text').textContent = Math.round(pct) + '%';
                取元素('prog-label').textContent = label;

                取元素('scan-spin').classList.toggle('hidden', s.scan_status !== 'scanning');
                取元素('btn-add-src').disabled = s.scan_status !== 'idle';
                取元素('btn-export').disabled = s.export_status === 'exporting';
                取元素('btn-cancel-exp').style.display = s.export_status === 'exporting' ? '' : 'none';
            }

            /* ===== 轮询 ===== */
            async function 轮询() {
                try {
                    const r = await fetch('/api/localout/state');
                    const s = await r.json();
                    _上次状态 = s;

                    const nowAvailable = new Set(s.available_keys || []);
                    const markByAvailability = (cards) => {
                        for (const c of cards || []) {
                            const isDevice = c.source_type === 'drive' || c.source_type === 'adb';
                            if (!isDevice) continue;
                            const k = `${c.source_type || ''}|${c.source_label || ''}`;
                            if (nowAvailable.has(k)) _已移除编号.delete(c.id);
                            else if (_上次可用键.has(k)) _已移除编号.add(c.id);
                        }
                    };
                    markByAvailability(s.source_cards);
                    markByAvailability(s.task_cards);
                    _上次可用键 = nowAvailable;

                    渲染列('src', s.source_cards);
                    渲染列('task', s.task_cards);
                    渲染列('done', s.completed_cards);
                    渲染日志(s.logs);
                    更新进度(s);
                    更新恢复状态(s);

                    取元素('badge-src').textContent = s.source_cards.length;
                    取元素('badge-task').textContent = s.task_cards.length;
                    取元素('badge-done').textContent = s.completed_cards.length;
                    取元素('st-src').textContent = s.source_cards.length;
                    取元素('st-task').textContent = s.task_cards.length;
                    取元素('st-done').textContent = s.completed_cards.length;
                    const 扫描中 = s.scan_status === 'scanning';
                    const 已暂停 = s.scan_status === 'paused';
                    取元素('btn-pause-scan').style.display = 扫描中 ? '' : 'none';
                    取元素('btn-resume-scan').style.display = 已暂停 ? '' : 'none';
                    取元素('btn-cancel-scan').style.display = (扫描中 || 已暂停) ? '' : 'none';

                    // 清理失效选择
                    const srcIds = new Set(s.source_cards.map(c => c.id));
                    const taskIds = new Set(s.task_cards.map(c => c.id));
                    for (const id of 已选来源) { if (!srcIds.has(id)) 已选来源.delete(id); }
                    for (const id of 已选任务) { if (!taskIds.has(id)) 已选任务.delete(id); }

                } catch (e) { }
            }

            /* ===== BG STARS ===== */
            function 初始化背景星星() {
                const 画布 = 取元素('bg-cv'), 画笔 = 画布.getContext('2d');
                const 橙色 = '#F5A623', 粉色 = '#E85B8A';
                let 星星组 = [];
                function 调整尺寸() { 画布.width = innerWidth; 画布.height = innerHeight; }
                调整尺寸(); window.addEventListener('resize', 调整尺寸);
                for (let i = 0; i < 28; i++) {
                    星星组.push({
                        x: Math.random() * innerWidth, y: Math.random() * innerHeight,
                        sz: Math.random() * 10 + 4, r: Math.random() * Math.PI * 2,
                        rv: (Math.random() - .5) * .015,
                        vy: Math.random() * .25 + .08, vx: (Math.random() - .5) * .2,
                        c: Math.random() > .5 ? 橙色 : 粉色,
                        al: Math.random() * .35 + .15, phase: Math.random() * Math.PI * 2
                    });
                }
                function 绘制星星(x, y, r, sz, col, al) {
                    if (al < .01) return;
                    画笔.save(); 画笔.globalAlpha = al; 画笔.translate(x, y); 画笔.rotate(r);
                    画笔.beginPath();
                    for (let i = 0; i < 5; i++) {
                        const ao = i * 2 * Math.PI / 5 - Math.PI / 2, ai = ao + Math.PI / 5;
                        i ? 画笔.lineTo(Math.cos(ao) * sz, Math.sin(ao) * sz)
                            : 画笔.moveTo(Math.cos(ao) * sz, Math.sin(ao) * sz);
                        画笔.lineTo(Math.cos(ai) * sz * .4, Math.sin(ai) * sz * .4);
                    }
                    画笔.closePath(); 画笔.fillStyle = col; 画笔.fill(); 画笔.restore();
                }
                (function 循环() {
                    画笔.clearRect(0, 0, 画布.width, 画布.height);
                    星星组.forEach(s => {
                        s.x += s.vx; s.y += s.vy; s.r += s.rv; s.phase += .012;
                        if (s.y > innerHeight + 20) { s.y = -20; s.x = Math.random() * innerWidth; }
                        if (s.x < -20) s.x = innerWidth + 20;
                        if (s.x > innerWidth + 20) s.x = -20;
                        绘制星星(s.x, s.y, s.r, s.sz, s.c, s.al * (.7 + .3 * Math.sin(s.phase)));
                    });
                    requestAnimationFrame(循环);
                })();
            }

            /* ===== SEARCH DEBOUNCE ===== */
            ['src-search', 'task-search', 'done-search'].forEach(id => {
                取元素(id).addEventListener('input', () => {
                    if (!_上次状态) return;
                    const col = id.split('-')[0];
                    const map = { src: 'source_cards', task: 'task_cards', done: 'completed_cards' };
                    const el = 取元素(col + '-cards'); el._lh = null;
                    渲染列(col, _上次状态[map[col]]);
                });
            });

            /* ===== ENV STATUS CHECK ===== */
            async function 检查环境状态() {
                try {
                    const r = await fetch('/api/localout/env-status');
                    const env = await r.json();
                    const issues = [];

                    if (!env.adb.available) {
                        issues.push('ADB 未找到');
                    }
                    if (!env.ffmpeg.available) {
                        issues.push('ffmpeg 未找到');
                    }

                    // 更新环境状态栏
                    const envBar = 取元素('env-bar');
                    const envBarText = 取元素('env-bar-text');
                    if (issues.length > 0) {
                        envBarText.textContent = issues.join(' | ') + ' — 部分功能可能不可用';
                        envBar.style.display = 'block';
                    } else {
                        envBar.style.display = 'none';
                    }

                    // 存储环境状态供后续使用
                    window._envStatus = env;
                } catch (e) {
                    console.warn('[LocalOut] 环境检查失败:', e);
                }
            }

            /* ===== INIT ===== */
            window.toggleDD = 切换下拉;
            window.closeDD = 关闭下拉;
            window.doBrowse = 浏览本地;
            window.doAddSource = 添加来源;
            window.切换下拉 = 切换下拉;
            window.关闭下拉 = 关闭下拉;
            window.浏览本地 = 浏览本地;
            window.添加来源 = 添加来源;
            window.pauseScan = 暂停扫描;
            window.resumeScan = 继续扫描;
            window.cancelScan = 取消扫描;
            window.暂停扫描 = 暂停扫描;
            window.继续扫描 = 继续扫描;
            window.取消扫描 = 取消扫描;
            window.openInExplorer = 在资源管理器中打开;
            window.openCardInExplorer = 在资源管理器中打开卡片;
            window.toggleCard = 切换卡片;
            window.deleteCard = 删除卡片;
            window.selAll = 全选;
            window.selNone = 取消选择;
            window.toTasks = 加入任务;
            window.startExport = 开始导出;
            window.cancelExport = 取消导出;
            window.clearSrc = 清空来源;
            window.clearTasks = 清空任务;
            window.clearDone = 清空完成;
            window.在资源管理器中打开 = 在资源管理器中打开;
            window.在资源管理器中打开卡片 = 在资源管理器中打开卡片;
            window.切换卡片 = 切换卡片;
            window.删除卡片 = 删除卡片;
            window.全选 = 全选;
            window.取消选择 = 取消选择;
            window.加入任务 = 加入任务;
            window.开始导出 = 开始导出;
            window.保存导出开关 = 保存导出开关;
            window.取消导出 = 取消导出;
            window.打开恢复窗口 = 打开恢复窗口;
            window.关闭恢复窗口 = 关闭恢复窗口;
            window.选择恢复归档 = 选择恢复归档;
            window.扫描恢复归档 = 扫描恢复归档;
            window.切换恢复归档 = 切换恢复归档;
            window.全选恢复归档 = 全选恢复归档;
            window.取消选择恢复归档 = 取消选择恢复归档;
            window.刷新恢复设备 = 刷新恢复设备;
            window.更新恢复按钮 = 更新恢复按钮;
            window.开始恢复缓存 = 开始恢复缓存;
            window.取消恢复缓存 = 取消恢复缓存;
            window.清空来源 = 清空来源;
            window.清空任务 = 清空任务;
            window.清空完成 = 清空完成;
            初始化背景星星();
            检查环境状态();
            载入导出开关();
            刷新设备可用性();
            轮询();
            setInterval(轮询, 500);
            setInterval(刷新设备可用性, 5000);
        })();
    </script>
    <script src="/assets/entry.js"></script>
</body>
