<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=1200">
    <title>MyBiOut!</title>
    <link rel="icon" href="./assets/logo.png" type="image/png">
    <link rel="stylesheet" href="/assets/entry.css">
    <style>
        /* ========== RESET ========== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        a {
            text-decoration: none;
            color: inherit;
        }

        /* ========== BODY / BG ========== */
        body {
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            background: url('./assets/bg.png') center center / cover no-repeat fixed;
            font-family: "Microsoft YaHei", "Segoe UI", system-ui, sans-serif;
            cursor: default;
            -webkit-font-smoothing: antialiased;
        }

        /* ========== PAGE CONTAINER ========== */
        .page {
            width: 1200px;
            height: 100vh;
            margin: 0 auto;
            position: relative;
        }

        /* ========== LOGO (左上) ========== */
        .logo {
            position: absolute;
            top: 28px;
            left: 28px;
            z-index: 5;
        }

        .logo img {
            width: 118px;
            height: 118px;
            object-fit: contain;
            border: 3px solid #F5A623;
            box-shadow: 5px 5px 0 #E85B8A;
            background: #fff;
        }

        @keyframes logo-shake {

            0%,
            100% {
                transform: rotate(0)
            }

            20% {
                transform: rotate(-4deg)
            }

            40% {
                transform: rotate(4deg)
            }

            60% {
                transform: rotate(-2deg)
            }

            80% {
                transform: rotate(2deg)
            }
        }

        .logo img:hover {
            animation: logo-shake .4s ease;
        }

        /* ========== 右上工具条：仓库 + 设置（避开中心卡片） ========== */
        .top-right {
            position: absolute;
            top: 28px;
            right: 28px;
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            gap: 12px;
            z-index: 5;
        }

        .settings-link {
            font-size: 15px;
            font-weight: 900;
            color: #7A1438;
            background: #fff;
            border: 3px solid #E85B8A;
            border-radius: 6px;
            padding: 9px 15px 8px;
            box-shadow: 5px 5px 0 #F5A623, 0 0 0 2px rgba(122, 20, 56, .16);
            text-shadow: 0 1px 0 rgba(255, 255, 255, .8);
            transition: color .2s, border-color .2s, background .2s, transform .12s, box-shadow .12s;
            white-space: nowrap;
        }

        .settings-link:hover {
            color: #fff;
            background: #E85B8A;
            border-color: #7A1438;
            box-shadow: 3px 3px 0 #7A1438, 0 0 20px rgba(232, 91, 138, .36);
            transform: translate(2px, 2px) rotate(-1deg);
        }

        .github-link {
            background: #F5A623;
            color: #fff;
            font-size: 15px;
            font-weight: bold;
            padding: 12px 24px;
            border: 3px solid #d48b0e;
            box-shadow: 5px 5px 0 #E85B8A;
            transition: transform .12s, box-shadow .12s;
            white-space: nowrap;
        }

        .github-link:hover {
            transform: translate(3px, 3px);
            box-shadow: 2px 2px 0 #E85B8A;
        }

        /* ========== CARDS ========== */
        .cards {
            position: absolute;
            top: 54%;
            left: 50%;
            transform: translate(-50%, -50%);
            display: flex;
            gap: 48px;
            z-index: 2;
        }

        .card {
            width: 272px;
            height: 272px;
            background: #fff;
            border: 3px solid #F5A623;
            box-shadow: 6px 6px 0 #E85B8A;
            position: relative;
            overflow: hidden;
            display: block;
            cursor: pointer;
            transition: transform .12s, box-shadow .12s;
        }

        .card:nth-child(1) {
            transform: rotate(-1.5deg)
        }

        .card:nth-child(2) {
            transform: rotate(0.8deg)
        }

        .card:nth-child(3) {
            transform: rotate(-0.6deg)
        }

        .card:nth-child(1):hover {
            transform: rotate(-1.5deg) translate(3px, 3px);
            box-shadow: 3px 3px 0 #E85B8A;
        }

        .card:nth-child(2):hover {
            transform: rotate(0.8deg) translate(3px, 3px);
            box-shadow: 3px 3px 0 #E85B8A;
        }

        .card:nth-child(3):hover {
            transform: rotate(-0.6deg) translate(3px, 3px);
            box-shadow: 3px 3px 0 #E85B8A;
        }

        .card img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        .card-overlay {
            position: absolute;
            inset: 0;
            background: rgba(232, 91, 138, .82);
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            transition: opacity .2s;
        }

        .card:hover .card-overlay {
            opacity: 1;
        }

        .card-overlay span {
            color: #fff;
            font-size: 26px;
            font-weight: 900;
            letter-spacing: 3px;
            text-shadow: 2px 2px 0 rgba(0, 0, 0, .12);
        }

        /* ========== MAN! ========== */
        .man-link {
            position: absolute;
            bottom: 48px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 44px;
            font-weight: 900;
            color: #F5A623;
            text-shadow: 3px 3px 0 #E85B8A;
            letter-spacing: 6px;
            transition: color .2s, text-shadow .2s;
            white-space: nowrap;
        }

        .man-link .t-default {
            display: inline;
        }

        .man-link .t-hover {
            display: none;
            font-size: 26px;
            letter-spacing: 3px;
        }

        .man-link:hover .t-default {
            display: none;
        }

        .man-link:hover .t-hover {
            display: inline;
        }

        .man-link:hover {
            color: #E85B8A;
            text-shadow: 3px 3px 0 #F5A623;
        }

        /* ========== STAR ANIMATION OVERLAY ========== */
        #star-overlay {
            position: fixed;
            inset: 0;
            z-index: 9999;
            display: none;
            overflow: hidden;
            /* 不可跳过：不接受点击 */
            pointer-events: none;
        }

        #star-overlay.active {
            display: block;
        }

        #star-canvas {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
        }

        .overlay-card {
            position: fixed;
            background: #fff;
            font-family: "Microsoft YaHei", "Segoe UI", system-ui, sans-serif;
            font-weight: 900;
            letter-spacing: 5px;
            padding: 22px 58px;
            font-size: 78px;
            pointer-events: none;
            opacity: 0;
            white-space: nowrap;
        }

        #overlay-t1 {
            color: #E85B8A;
            text-shadow: 5px 5px 0 #F5A623;
            border: 4px solid #F5A623;
            box-shadow: 8px 8px 0 #E85B8A;
            top: 30%;
            left: 50%;
        }

        #overlay-t2 {
            color: #F5A623;
            text-shadow: 5px 5px 0 #E85B8A;
            border: 4px solid #E85B8A;
            box-shadow: 8px 8px 0 #F5A623;
            top: 62%;
            left: 50%;
        }

        .ch-pre {
            display: inline-block;
            opacity: 0;
        }

        @keyframes ch-pop {
            0% {
                transform: scale(0) rotate(20deg);
                opacity: 0;
            }

            62% {
                transform: scale(1.32) rotate(-6deg);
                opacity: 1;
            }

            100% {
                transform: scale(1) rotate(0deg);
                opacity: 1;
            }
        }

        .ch-show {
            display: inline-block;
            animation: ch-pop .4s cubic-bezier(.34, 1.56, .64, 1) both;
        }

        /* ========== FLASH ========== */
        #flash-overlay {
            position: fixed;
            inset: 0;
            z-index: 10000;
            background: #fff;
            pointer-events: none;
            opacity: 0;
        }

        /* ========== GLOW PULSE ========== */
        @keyframes glow-pulse-pink {

            0%,
            100% {
                box-shadow: 8px 8px 0 #E85B8A, 0 0 15px rgba(232, 91, 138, 0.15);
            }

            50% {
                box-shadow: 8px 8px 0 #E85B8A, 0 0 40px rgba(232, 91, 138, 0.5), 0 0 80px rgba(245, 166, 35, 0.2);
            }
        }

        @keyframes glow-pulse-orange {

            0%,
            100% {
                box-shadow: 8px 8px 0 #F5A623, 0 0 15px rgba(245, 166, 35, 0.15);
            }

            50% {
                box-shadow: 8px 8px 0 #F5A623, 0 0 40px rgba(245, 166, 35, 0.5), 0 0 80px rgba(232, 91, 138, 0.2);
            }
        }

        #overlay-t1.glow {
            animation: glow-pulse-pink .9s ease-in-out infinite;
        }

        #overlay-t2.glow {
            animation: glow-pulse-orange .9s ease-in-out infinite;
        }

    </style>
</head>

<body>

    <div class="mybiout-entry-overlay" aria-hidden="true">
        <canvas class="mybiout-entry-canvas"></canvas>
        <div class="mybiout-entry-stage">
            <div class="mybiout-entry-core"></div>
        </div>
    </div>
    <div class="page">
        <div class="logo">
            <img src="./assets/logo.png" alt="MyBiOut!">
        </div>
        <div class="top-right">
            <a class="github-link" id="github-btn" href="https://github.com/Water-Run/MyBiOut" target="_blank"
                rel="noopener">来仓库点星标 ⭐ 提交问题 🐛</a>
            <a class="settings-link" href="/ohmyconfig">哦，我的设置 →</a>
        </div>
        <div class="cards">
            <a class="card" href="/localout">
                <img src="./assets/localout.png" alt="本地缓存导出">
                <div class="card-overlay"><span>本地缓存导出</span></div>
            </a>
            <a class="card" href="/bbdown">
                <img src="./assets/bbdown.png" alt="BBDown">
                <div class="card-overlay"><span>BBDown 下载</span></div>
            </a>
            <a class="card" href="/mdout">
                <img src="./assets/mdout.png" alt="Markdown导出">
                <div class="card-overlay"><span>Markdown 导出</span></div>
            </a>
        </div>
        <a class="man-link" href="/man">
            <span class="t-default">Man!</span>
            <span class="t-hover">ManualScript 手册</span>
        </a>
    </div>

    <!-- OVERLAY (无跳过按钮) -->
    <div id="star-overlay">
        <canvas id="star-canvas"></canvas>
        <div id="overlay-t1" class="overlay-card"></div>
        <div id="overlay-t2" class="overlay-card"></div>
    </div>
    <div id="flash-overlay"></div>

    <script>
        (function () {
            const 橙色 = '#F5A623', 粉色 = '#FB7299';

            const 遮罩 = document.getElementById('star-overlay');
            const 画布 = document.getElementById('star-canvas');
            const 画笔 = 画布.getContext('2d');
            const 文字一 = document.getElementById('overlay-t1');
            const 文字二 = document.getElementById('overlay-t2');
            const 按钮 = document.getElementById('github-btn');
            const 闪光层 = document.getElementById('flash-overlay');

            let 粒子们 = [], 动画帧号 = null, 运行中 = false;
            let 循环起点 = null, 显示轨道 = false;
            let 正在淡出 = false, 淡出起点 = 0;
            let _定时器号 = [], _间隔号 = [];
            /* ★ 核心状态：是否等待用户返回 */
            let 等待返回 = false;

            const 延迟执行 = (f, d) => _定时器号.push(setTimeout(f, d));
            const 间隔执行 = (f, d) => { const id = setInterval(f, d); _间隔号.push(id); };
            function 清理计时器() {
                _定时器号.forEach(clearTimeout); _定时器号 = [];
                _间隔号.forEach(clearInterval); _间隔号 = [];
            }

            function 调整尺寸() { 画布.width = innerWidth; 画布.height = innerHeight; }
            window.addEventListener('resize', () => { if (运行中) 调整尺寸(); });

            function 闪白(duration) {
                闪光层.style.transition = 'none';
                闪光层.style.opacity = '0.88';
                requestAnimationFrame(() => {
                    闪光层.style.transition = 'opacity ' + (duration || 400) + 'ms ease-out';
                    闪光层.style.opacity = '0';
                });
            }

            function 屏幕震动(intensity, duration) {
                const start = performance.now();
                (function 震动步进() {
                    const elapsed = performance.now() - start;
                    if (elapsed > duration || !运行中) { 遮罩.style.transform = ''; return; }
                    const decay = 1 - elapsed / duration;
                    const x = (Math.random() - .5) * 2 * intensity * decay;
                    const y = (Math.random() - .5) * 2 * intensity * decay;
                    遮罩.style.transform = `translate(${x}px,${y}px)`;
                    requestAnimationFrame(震动步进);
                })();
            }

            function 绘制星星(x, y, r, rot, col, a) {
                if (a < .012) return;
                画笔.save();
                画笔.globalAlpha = Math.min(1, a);
                画笔.translate(x, y); 画笔.rotate(rot);
                画笔.beginPath();
                for (let i = 0; i < 5; i++) {
                    const ao = i * 2 * Math.PI / 5 - Math.PI / 2;
                    const ai = ao + Math.PI / 5;
                    i ? 画笔.lineTo(Math.cos(ao) * r, Math.sin(ao) * r)
                        : 画笔.moveTo(Math.cos(ao) * r, Math.sin(ao) * r);
                    画笔.lineTo(Math.cos(ai) * r * .4, Math.sin(ai) * r * .4);
                }
                画笔.closePath(); 画笔.fillStyle = col; 画笔.fill();
                画笔.restore();
            }

            function 绘制辉光(x, y, r, col, alpha) {
                if (alpha < 0.01 || r < 1) return;
                画笔.save();
                画笔.globalAlpha = alpha;
                const grad = 画笔.createRadialGradient(x, y, 0, x, y, r);
                grad.addColorStop(0, col);
                grad.addColorStop(1, 'transparent');
                画笔.fillStyle = grad;
                画笔.fillRect(x - r, y - r, r * 2, r * 2);
                画笔.restore();
            }

            /* ======== PARTICLES ======== */

            class 爆裂粒子 {
                constructor(px, py, big) {
                    const a = Math.random() * Math.PI * 2;
                    const s = big ? Math.random() * 15 + 5 : Math.random() * 9 + 2;
                    this.x = px; this.y = py;
                    this.vx = Math.cos(a) * s; this.vy = Math.sin(a) * s;
                    this.sz = big ? Math.random() * 24 + 10 : Math.random() * 13 + 5;
                    this.c = Math.random() > .5 ? 橙色 : 粉色;
                    this.r = Math.random() * Math.PI * 2;
                    this.rv = (Math.random() - .5) * .32;
                    this.life = 1;
                    this.dc = big ? .006 + Math.random() * .009 : .009 + Math.random() * .014;
                    this.g = .2;
                }
                步进() { this.x += this.vx; this.y += this.vy; this.vy += this.g; this.vx *= .99; this.r += this.rv; this.life -= this.dc; return this.life > 0; }
                绘制() { 绘制星星(this.x, this.y, this.sz, this.r, this.c, this.life); }
            }

            class 星雨 {
                constructor() {
                    this.x = Math.random() * innerWidth;
                    this.y = -Math.random() * 70 - 10;
                    this.vy = Math.random() * 3.2 + 1.4;
                    this.vx = (Math.random() - .5) * 1.6;
                    this.sz = Math.random() * 14 + 5;
                    this.c = Math.random() > .5 ? 橙色 : 粉色;
                    this.r = Math.random() * Math.PI * 2;
                    this.rv = (Math.random() - .5) * .07;
                    this.al = Math.random() * .5 + .5;
                }
                步进() { this.x += this.vx; this.y += this.vy; this.r += this.rv; return this.y < innerHeight + 30; }
                绘制() { 绘制星星(this.x, this.y, this.sz, this.r, this.c, this.al); }
            }

            class 流星 {
                constructor() {
                    const a = Math.PI * (.07 + Math.random() * .22);
                    const s = Math.random() * 11 + 8;
                    this.x = Math.random() * innerWidth * .5;
                    this.y = Math.random() * innerHeight * .42;
                    this.vx = Math.cos(a) * s; this.vy = Math.sin(a) * s;
                    this.sz = Math.random() * 11 + 5;
                    this.c = Math.random() > .5 ? 橙色 : 粉色;
                    this.r = 0; this.trail = []; this.life = 1; this.dc = .022;
                }
                步进() {
                    this.trail.push({ x: this.x, y: this.y });
                    if (this.trail.length > 22) this.trail.shift();
                    this.x += this.vx; this.y += this.vy;
                    this.r += .19; this.life -= this.dc;
                    return this.life > 0 && this.x < innerWidth + 60;
                }
                绘制() {
                    this.trail.forEach((p, i) => {
                        const t = i / this.trail.length;
                        绘制星星(p.x, p.y, this.sz * t * .75, this.r, this.c, t * this.life * .45);
                    });
                    绘制辉光(this.x, this.y, this.sz * 1.5, this.c, this.life * 0.25);
                    绘制星星(this.x, this.y, this.sz, this.r, this.c, this.life);
                }
            }

            class 冲击波 {
                constructor(px, py, maxR, col) {
                    this.x = px; this.y = py;
                    this.r = 0; this.maxR = maxR;
                    this.c = col || (Math.random() > .5 ? 橙色 : 粉色);
                    this.life = 1; this.speed = maxR / 26;
                }
                步进() { this.r += this.speed; this.life = Math.max(0, 1 - this.r / this.maxR); return this.life > 0; }
                绘制() {
                    画笔.save(); 画笔.globalAlpha = this.life * 0.55;
                    画笔.strokeStyle = this.c; 画笔.lineWidth = 2 + this.life * 6;
                    画笔.beginPath(); 画笔.arc(this.x, this.y, this.r, 0, Math.PI * 2);
                    画笔.stroke(); 画笔.restore();
                }
            }

            class 闪烁粒子 {
                constructor() {
                    this.x = Math.random() * innerWidth;
                    this.y = Math.random() * innerHeight;
                    this.sz = Math.random() * 7 + 2;
                    this.c = Math.random() > .5 ? 橙色 : 粉色;
                    this.phase = Math.random() * Math.PI * 2;
                    this.speed = Math.random() * 3 + 2;
                    this.life = 1; this.dc = 0.004 + Math.random() * 0.006;
                    this.r = Math.random() * Math.PI * 2;
                }
                步进() { this.phase += 0.08; this.r += 0.015; this.life -= this.dc; return this.life > 0; }
                绘制() { 绘制星星(this.x, this.y, this.sz, this.r, this.c, Math.abs(Math.sin(this.phase * this.speed)) * this.life); }
            }

            class 烟花 {
                constructor(sx, targetY) {
                    this.x = sx; this.y = innerHeight + 10;
                    this.targetY = targetY;
                    this.vy = -(Math.random() * 3 + 12);
                    this.sz = 7; this.c = Math.random() > .5 ? 橙色 : 粉色;
                    this.r = 0; this.trail = []; this.exploded = false;
                }
                步进() {
                    if (this.exploded) return false;
                    this.trail.push({ x: this.x, y: this.y });
                    if (this.trail.length > 18) this.trail.shift();
                    this.y += this.vy; this.vy += 0.12; this.r += 0.12;
                    if (this.y <= this.targetY) {
                        this.exploded = true;
                        爆裂(this.x, this.y, 55, true);
                        粒子们.push(new 冲击波(this.x, this.y, 180, this.c));
                        环形爆裂(this.x, this.y, 12, 6);
                        return false;
                    }
                    return true;
                }
                绘制() {
                    绘制辉光(this.x, this.y, 22, this.c, 0.4);
                    this.trail.forEach((p, i) => {
                        const t = i / this.trail.length;
                        绘制星星(p.x, p.y, this.sz * t * 0.6, this.r, this.c, t * 0.5);
                    });
                    绘制星星(this.x, this.y, this.sz, this.r, this.c, 1);
                }
            }

            class 速度线 {
                constructor(cx, cy) {
                    const a = Math.random() * Math.PI * 2;
                    const innerR = Math.random() * 40 + 20;
                    const outerR = innerR + Math.random() * 250 + 80;
                    this.x1 = cx + Math.cos(a) * innerR; this.y1 = cy + Math.sin(a) * innerR;
                    this.x2 = cx + Math.cos(a) * outerR; this.y2 = cy + Math.sin(a) * outerR;
                    this.c = Math.random() > .5 ? 橙色 : 粉色;
                    this.life = 1; this.dc = 0.025 + Math.random() * 0.02;
                    this.lw = Math.random() * 3 + 1;
                }
                步进() { this.life -= this.dc; return this.life > 0; }
                绘制() {
                    画笔.save(); 画笔.globalAlpha = this.life * 0.6;
                    画笔.strokeStyle = this.c; 画笔.lineWidth = this.lw * this.life;
                    画笔.beginPath(); 画笔.moveTo(this.x1, this.y1); 画笔.lineTo(this.x2, this.y2);
                    画笔.stroke(); 画笔.restore();
                }
            }

            class 彩屑 {
                constructor(px, py) {
                    const a = Math.random() * Math.PI * 2;
                    const s = Math.random() * 7 + 3;
                    this.x = px; this.y = py;
                    this.vx = Math.cos(a) * s; this.vy = Math.sin(a) * s - 4;
                    this.w = Math.random() * 10 + 4; this.h = Math.random() * 5 + 2;
                    this.c = Math.random() > .5 ? 橙色 : 粉色;
                    this.r = Math.random() * Math.PI * 2;
                    this.rv = (Math.random() - .5) * .2;
                    this.life = 1; this.dc = 0.006 + Math.random() * 0.006; this.g = 0.1;
                }
                步进() { this.x += this.vx; this.y += this.vy; this.vy += this.g; this.vx *= 0.99; this.r += this.rv; this.life -= this.dc; return this.life > 0; }
                绘制() {
                    画笔.save(); 画笔.globalAlpha = this.life;
                    画笔.translate(this.x, this.y); 画笔.rotate(this.r);
                    画笔.fillStyle = this.c; 画笔.fillRect(-this.w / 2, -this.h / 2, this.w, this.h);
                    画笔.restore();
                }
            }

            class 辉光球 {
                constructor(x, y, col) {
                    this.x = x; this.y = y; this.r = 10;
                    this.maxR = Math.random() * 80 + 40;
                    this.c = col || (Math.random() > .5 ? 橙色 : 粉色);
                    this.life = 1; this.speed = (this.maxR - 10) / 38;
                }
                步进() { this.r += this.speed; this.life = Math.max(0, 1 - this.r / this.maxR); return this.life > 0; }
                绘制() { 绘制辉光(this.x, this.y, this.r, this.c, this.life * 0.4); }
            }

            /* ======== 辅助工具 ======== */

            function 爆裂(px, py, n, big) { for (let i = 0; i < n; i++) 粒子们.push(new 爆裂粒子(px, py, big)); }

            function 环形爆裂(cx, cy, count, speed) {
                for (let i = 0; i < count; i++) {
                    const angle = (i / count) * Math.PI * 2;
                    const b = new 爆裂粒子(cx, cy, true);
                    b.vx = Math.cos(angle) * speed; b.vy = Math.sin(angle) * speed;
                    b.g = 0; b.dc = 0.012; 粒子们.push(b);
                }
            }

            function 速度线群(cx, cy, count) { for (let i = 0; i < count; i++) 粒子们.push(new 速度线(cx, cy)); }
            function 彩屑爆裂(cx, cy, count) { for (let i = 0; i < count; i++) 粒子们.push(new 彩屑(cx, cy)); }
            function 生成闪烁(count) { for (let i = 0; i < count; i++) 粒子们.push(new 闪烁粒子()); }

            function 绘制轨道(elapsed) {
                const ocx = innerWidth / 2, ocy = innerHeight * .5;
                [
                    { r: 170, sp: 1.5, n: 5, cols: [橙色, 粉色, 橙色, 粉色, 橙色], ys: .35, szBase: 10 },
                    { r: 235, sp: -1.0, n: 6, cols: [粉色, 橙色, 粉色, 橙色, 粉色, 橙色], ys: .28, szBase: 8 },
                    { r: 305, sp: 0.7, n: 4, cols: [橙色, 粉色, 橙色, 粉色], ys: .22, szBase: 12 },
                ].forEach(({ r, sp, n, cols, ys, szBase }) => {
                    for (let i = 0; i < n; i++) {
                        const a = elapsed * sp + i * 2 * Math.PI / n;
                        const sz = szBase + Math.sin(elapsed * 2.5 + i * 1.3) * 3;
                        const sx = ocx + Math.cos(a) * r, sy = ocy + Math.sin(a) * r * ys;
                        绘制辉光(sx, sy, sz * 2.2, cols[i % cols.length], 0.13);
                        绘制星星(sx, sy, sz, a * 2.1, cols[i % cols.length], .88);
                    }
                });
            }

            /* ---- char reveal ---- */
            function 显现字符(el, text, onDone) {
                el.innerHTML = [...text].map(ch => `<span class="ch-pre">${ch}</span>`).join('');
                const spans = [...el.children];
                spans.forEach((sp, i) => {
                    延迟执行(() => {
                        sp.className = 'ch-show';
                        const rc = sp.getBoundingClientRect();
                        const cx = rc.left + rc.width / 2, cy = rc.top + rc.height / 2;
                        爆裂(cx, cy, 18, false);
                        粒子们.push(new 辉光球(cx, cy));
                        if (i === spans.length - 1) {
                            延迟执行(() => {
                                爆裂(cx, cy, 55, true);
                                屏幕震动(5, 200); 闪白(280);
                                粒子们.push(new 冲击波(cx, cy, 200, 粉色));
                            }, 85);
                        }
                    }, i * 170);
                });
                延迟执行(onDone, spans.length * 170 + 260);
            }

            /* ---- Web Animations ---- */
            function 左侧滑入(el, onDone) {
                const rot = 'rotate(-2deg)';
                const anim = el.animate([
                    { transform: `translate(-230%, -50%) ${rot}`, opacity: 0 },
                    { transform: `translate(-44%, -50%) ${rot}`, opacity: 1, offset: .64 },
                    { transform: `translate(-53%, -50%) ${rot}`, offset: .82 },
                    { transform: `translate(-50%, -50%) ${rot}`, opacity: 1 }
                ], { duration: 660, easing: 'ease-out', fill: 'forwards' });
                anim.onfinish = () => {
                    el.style.opacity = '1';
                    el.style.transform = `translate(-50%, -50%) ${rot}`;
                    anim.cancel();
                    const rc = el.getBoundingClientRect();
                    const cx = rc.left + rc.width / 2, cy = rc.top + rc.height / 2;
                    屏幕震动(10, 320);
                    粒子们.push(new 冲击波(cx, cy, 240, 橙色));
                    粒子们.push(new 辉光球(cx, cy, 橙色));
                    爆裂(cx - rc.width / 2, cy, 22, true);
                    闪白(250);
                    onDone();
                };
            }

            function 顶部坠入(el, onDone) {
                const rot = 'rotate(1.5deg)';
                const anim = el.animate([
                    { transform: `translate(-50%, -900%) ${rot} scale(.45)`, opacity: 0 },
                    { transform: `translate(-50%, -44%) ${rot} scale(1.1)`, opacity: 1, offset: .64 },
                    { transform: `translate(-50%, -54%) ${rot} scale(.96)`, offset: .82 },
                    { transform: `translate(-50%, -50%) ${rot} scale(1)`, opacity: 1 }
                ], { duration: 700, easing: 'ease-out', fill: 'forwards' });
                anim.onfinish = () => {
                    el.style.opacity = '1';
                    el.style.transform = `translate(-50%, -50%) ${rot}`;
                    anim.cancel();
                    const rc = el.getBoundingClientRect();
                    const cx = rc.left + rc.width / 2, cy = rc.top + rc.height / 2;
                    屏幕震动(12, 380);
                    粒子们.push(new 冲击波(cx, cy, 280, 粉色));
                    粒子们.push(new 辉光球(cx, cy, 粉色));
                    爆裂(cx, cy + rc.height / 2, 28, true);
                    彩屑爆裂(cx, cy, 30);
                    闪白(280);
                    onDone();
                };
            }

            function 开始漂浮(el, rotDeg) {
                const rot = `rotate(${rotDeg}deg)`;
                el.animate([
                    { transform: `translate(-50%, -50%) ${rot}` },
                    { transform: `translate(-50%, -55%) ${rot}` },
                    { transform: `translate(-50%, -50%) ${rot}` }
                ], { duration: 2400, iterations: Infinity, easing: 'ease-in-out' });
            }

            /* ---- 主循环 ---- */
            function 主循环(ts) {
                if (!运行中) return;
                if (!循环起点) 循环起点 = ts;
                const elapsed = (ts - 循环起点) / 1000;
                画笔.clearRect(0, 0, 画布.width, 画布.height);
                粒子们 = 粒子们.filter(p => { const ok = p.步进(); if (ok) p.绘制(); return ok; });
                if (显示轨道) 绘制轨道(elapsed);
                if (正在淡出) {
                    const ft = (ts - 淡出起点) / 750;
                    const a = Math.max(0, 1 - ft);
                    遮罩.style.opacity = a;
                    if (a <= 0) { 结束动画(); return; }
                }
                动画帧号 = requestAnimationFrame(主循环);
            }

            /* ---- play ---- */
            function 播放动画() {
                if (运行中) return;
                运行中 = true; 粒子们 = []; 显示轨道 = false; 正在淡出 = false; 循环起点 = null;
                调整尺寸();

                遮罩.classList.add('active');
                遮罩.style.background = 'rgba(255,255,255,.96)';
                遮罩.style.opacity = '0';
                遮罩.style.transition = 'opacity .38s ease';
                文字一.style.opacity = '0'; 文字一.style.transform = '';
                文字二.style.opacity = '0'; 文字二.style.transform = '';
                文字一.innerHTML = ''; 文字二.innerHTML = '';
                文字一.classList.remove('glow'); 文字二.classList.remove('glow');

                requestAnimationFrame(() => requestAnimationFrame(() => {
                    遮罩.style.opacity = '1';
                }));

                const vcx = innerWidth / 2, vcy = innerHeight / 2;

                延迟执行(() => {
                    闪白(350);
                    爆裂(vcx, vcy, 100, true);
                    粒子们.push(new 冲击波(vcx, vcy, 350, 橙色));
                    粒子们.push(new 冲击波(vcx, vcy, 260, 粉色));
                    速度线群(vcx, vcy, 45);
                    屏幕震动(12, 400);
                    for (let i = 0; i < 5; i++) 粒子们.push(new 辉光球(vcx, vcy));
                }, 55);

                延迟执行(() => {
                    爆裂(vcx * 0.5, vcy * 0.6, 30, true);
                    爆裂(vcx * 1.5, vcy * 0.6, 30, true);
                    粒子们.push(new 冲击波(vcx * 0.5, vcy * 0.6, 120, 粉色));
                    粒子们.push(new 冲击波(vcx * 1.5, vcy * 0.6, 120, 橙色));
                }, 300);

                延迟执行(() => 间隔执行(() => 生成闪烁(3), 200), 380);

                延迟执行(() => 粒子们.push(new 烟花(vcx * 0.35, vcy * 0.32)), 500);

                延迟执行(() => {
                    左侧滑入(文字一, () => {
                        文字一.classList.add('glow');
                        显现字符(文字一, '听我说', () => 开始漂浮(文字一, -2));
                    });
                }, 700);

                延迟执行(() => 粒子们.push(new 烟花(vcx * 1.65, vcy * 0.4)), 850);

                延迟执行(() => 间隔执行(() => { for (let i = 0; i < 8; i++) 粒子们.push(new 星雨()); }, 150), 1000);

                延迟执行(() => 粒子们.push(new 烟花(vcx * 0.75, vcy * 0.28)), 1600);

                延迟执行(() => {
                    顶部坠入(文字二, () => {
                        文字二.classList.add('glow');
                        显现字符(文字二, '谢谢你', () => 开始漂浮(文字二, 1.5));
                    });
                }, 2000);

                延迟执行(() => {
                    显示轨道 = true;
                    间隔执行(() => 粒子们.push(new 流星()), 400);
                }, 2500);

                延迟执行(() => {
                    粒子们.push(new 烟花(vcx * 0.28, vcy * 0.22));
                    粒子们.push(new 烟花(vcx * 1.72, vcy * 0.28));
                }, 3200);

                延迟执行(() => {
                    彩屑爆裂(vcx, vcy, 60);
                    速度线群(vcx, vcy, 30);
                    环形爆裂(vcx, vcy, 18, 8);
                    粒子们.push(new 冲击波(vcx, vcy, 280, 橙色));
                }, 3800);

                /* 终场爆发 */
                延迟执行(() => {
                    闪白(400); 屏幕震动(15, 500);
                    爆裂(vcx, vcy, 120, true);
                    彩屑爆裂(vcx, vcy, 80);
                    速度线群(vcx, vcy, 50);
                    环形爆裂(vcx, vcy, 24, 10);
                    粒子们.push(new 冲击波(vcx, vcy, 450, 橙色));
                    粒子们.push(new 冲击波(vcx, vcy, 380, 粉色));
                    for (let i = 0; i < 6; i++) {
                        const a = (i / 6) * Math.PI * 2, d = 200;
                        延迟执行(() => {
                            爆裂(vcx + Math.cos(a) * d, vcy + Math.sin(a) * d, 30, true);
                            粒子们.push(new 冲击波(vcx + Math.cos(a) * d, vcy + Math.sin(a) * d, 140, i % 2 ? 橙色 : 粉色));
                        }, i * 70);
                    }
                }, 4500);

                /* 淡出 */
                延迟执行(() => {
                    清理计时器();
                    遮罩.style.transition = 'none';
                    正在淡出 = true;
                    淡出起点 = performance.now();
                }, 5600);

                动画帧号 = requestAnimationFrame(主循环);
            }

            /* ---- end ---- */
            function 结束动画() {
                运行中 = false; 清理计时器();
                粒子们 = []; 显示轨道 = false; 正在淡出 = false;
                [文字一, 文字二].forEach(el => {
                    el.getAnimations().forEach(a => a.cancel());
                    el.innerHTML = ''; el.style.opacity = '0'; el.style.transform = '';
                    el.classList.remove('glow');
                });
                遮罩.classList.remove('active');
                遮罩.style.opacity = ''; 遮罩.style.background = '';
                遮罩.style.transition = ''; 遮罩.style.transform = '';
                if (动画帧号) { cancelAnimationFrame(动画帧号); 动画帧号 = null; }
                循环起点 = null;
            }

            /* ========================================
             *  ★ 核心逻辑：点击 → 跳转 → 返回后播放
             * ======================================== */

            按钮.addEventListener('click', function (e) {
                /* 让浏览器正常跳转（target=_blank），不阻止默认行为 */
                /* 标记「等待用户返回」 */
                等待返回 = true;
            });

            /* 用户切回本标签页时触发 */
            document.addEventListener('visibilitychange', function () {
                if (document.visibilityState === 'visible' && 等待返回) {
                    等待返回 = false;
                    /* 给一点小延迟，让页面完全渲染好 */
                    setTimeout(播放动画, 120);
                }
            });

            /* 有些浏览器不触发 visibilitychange 但触发 focus */
            window.addEventListener('focus', function () {
                if (等待返回) {
                    等待返回 = false;
                    setTimeout(播放动画, 120);
                }
            });

        })();
    </script>
    <script src="/assets/entry.js"></script>
</body>
