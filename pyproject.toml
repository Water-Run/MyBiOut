[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mybiout"
version = "60717.0"
description = "MyBiOut! 绿色版哔哩哔哩导出工具集 (解压双击运行)"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "WaterRun", email = "linzhuangrun49@gmail.com" }]
maintainers = [{ name = "WaterRun", email = "linzhuangrun49@gmail.com" }]
keywords = [
    "bilibili",
    "downloader",
    "exporter",
    "video",
    "cache",
    "markdown",
    "bbdown",
    "m4s",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.14",
    "Topic :: Multimedia :: Video",
    "Topic :: Utilities",
]
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "httpx>=0.27.0",
    "biliffm4s>=0.1.0",
    "pywebview>=5.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0.0", "ruff>=0.1.0"]
green = ["pyinstaller>=6.0.0"]

# 发行形态仅为绿色 exe; 开发调试使用: python -m mybiout

[project.urls]
Homepage = "https://github.com/Water-Run/MyBiOut"
Repository = "https://github.com/Water-Run/MyBiOut.git"
Issues = "https://github.com/Water-Run/MyBiOut/issues"

[tool.hatch.build.targets.sdist]
include = ["/mybiout", "/hatch_build.py"]
[tool.hatch.build.targets.sdist.hooks.custom]
path = "hatch_build.py"

[tool.hatch.build.targets.wheel]
packages = ["mybiout"]
pure-python = false
[tool.hatch.build.targets.wheel.hooks.custom]
path = "hatch_build.py"

[tool.ruff]
target-version = "py314"
line-length = 120

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "C4", "UP", "SIM", "PTH", "RUF"]
ignore = ["E501", "B008", "SIM108", "RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.isort]
known-first-party = ["mybiout"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-v --tb=short"
